<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>KMBID 讲解片</title>
<style>
  @font-face { font-family: "Permanent Marker"; src: url("../../KMBearAnimationBase/assets/fonts/PermanentMarker-Regular.ttf"); font-display: block; }
  @font-face { font-family: "Smiley"; src: url("../../KMBearAnimationBase/assets/fonts/SmileySans-Oblique.ttf"); font-display: block; }
  html, body { margin: 0; background: #1b1820; color: #eee; font: 13px system-ui, sans-serif; }
  main { padding: 12px; display: grid; gap: 8px; }
  #out { width: min(100%, 1280px); aspect-ratio: 16 / 9; height: auto; background: #F3EBDC; }
  .p5Canvas { display: none !important; }
  .bar { display: flex; gap: 10px; align-items: center; max-width: 1280px; }
  #scrub { flex: 1; }
  #tt { font-variant-numeric: tabular-nums; min-width: 190px; }
</style>
<script src="../../KMBearAnimationBase/node_modules/p5/lib/p5.min.js"></script>
<script src="../../KMBearAnimationBase/node_modules/p5.brush/dist/p5.brush.js"></script>
</head>
<body>
<main>
  <canvas id="out" width="1920" height="1080"></canvas>
  <div class="bar"><input id="scrub" type="range" min="0" max="11" step="0.0417" value="0"><span id="tt">loading…</span></div>
</main>
<!-- engine -->
<script src="config.js"></script>
<script src="../../KMBearAnimationBase/src/core.js"></script>
<script src="../../KMBearAnimationBase/src/clawd.js"></script>
<script src="../../KMBearAnimationBase/src/kmbear.js"></script>

</html>
