# KMFA A0 重算 + zero-delta —— 云上(GitHub Actions)从私有库 Private-Database 取真源、
# 按 agent 自定的合规会计口径重算,只回 public-safe 结果(差额率/通过与否,无金额)。
# 前提:KMOS 仓需有 secret PRIVATE_DB_TOKEN(对 LinzeColin/Private-Database 有 read 权限的 GitHub PAT)。
# 手动触发(workflow_dispatch);真实财务不入公开 KMOS,仅私有库读、内存算、public-safe 出。
name: kmfa-a0-recompute

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  a0:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 预检 secret
        env:
          PRIVATE_DB_TOKEN: ${{ secrets.PRIVATE_DB_TOKEN }}
        run: |
          if [ -z "$PRIVATE_DB_TOKEN" ]; then
            echo "::error::缺 PRIVATE_DB_TOKEN secret——请在 KMOS 仓 Settings→Secrets→Actions 添加(对 Private-Database 有 read 的 PAT),与 COOLIFY_API_TOKEN 同样操作。"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 装依赖
        run: python -m pip install --quiet openpyxl

      - name: 云上 A0 重算 + zero-delta(读私有库,只出 public-safe)
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_DB_TOKEN }}
        run: |
          set -euo pipefail
          python3 KMFA/tools/a0_zero_delta_cloud.py
          echo "## A0 zero-delta（public-safe，零金额）" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat a0_zero_delta_result.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: 上传结果给回写作业
        uses: actions/upload-artifact@v4
        with:
          name: a0-result
          path: a0_zero_delta_result.json
          retention-days: 1

  # ★ 回写单独一个作业:算的那个作业保持 contents:read,只有这个拿 write。
  #   状态回写不该让重算作业获得写仓权限 —— 权限跟着最小需要走。
  report:
    needs: a0
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/download-artifact@v4
        with: {name: a0-result}

      - name: 把 A0 对账结果写回业务流状态
        run: |
          set -euo pipefail
          # ★ 只上报这一次重算**真正测到的那一格**:项目成本的「校验」段。
          #   A0 做的就是「税务基准 vs 金蝶明细账」对账,这正是 verify 的产出。
          #   绝不拿它去代表 intake/parse/compute —— 那是拿相邻信号冒充产出,是假绿。
          PASS=$(python3 -c "import json;print(json.load(open('a0_zero_delta_result.json'))['zero_delta_pass'])")
          PCT=$(python3 -c "import json;d=json.load(open('a0_zero_delta_result.json'));print(d.get('delta_vs_a0_pct'))")
          if [ "$PASS" = "True" ]; then
            STATE=healthy;  NOTE="A0 零差额对账通过"
          else
            # 差额非零 = 真实跨基础/时点对账缺口,不是管道错误 → 通但打折
            STATE=degraded; NOTE="A0 对账差额 ${PCT}%（现金 vs 权责，非管道错误）"
          fi
          # ★ 只出百分比,绝不出金额 —— 脚本自己标了 amounts_public:false
          python3 KMFA/tools/report_flow_state.py \
            --project-dir KMFA --key 'BL-PROJECT-COST.verify' \
            --state "$STATE" --note "$NOTE"

      - name: 提交
        run: |
          git config user.name  "kmfa-flow-state"
          git config user.email "kmfa-flow-state@users.noreply.github.com"
          git add KMFA/docs/governance/flow_state.json
          git diff --cached --quiet && echo "状态没变，不产生空提交" && exit 0
          git commit -m "chore(kmfa): 回写 A0 对账的业务流状态 [skip ci]"
          git push

      - name: 留存 public-safe 结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a0-zero-delta-public-safe
          path: a0_zero_delta_result.json
          if-no-files-found: ignore
