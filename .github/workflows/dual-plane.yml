name: Dual-Plane Governance

# 全仓强制：本仓每个项目都必须就位双平面七文件架构并过门。
# 任一项目缺文件、人类平面渲染漂移、或三道门 FAIL -> 整仓 CI 红。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  dual-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 PyYAML（渲染 config.yaml / data_contract.yaml 需要，保证渲染确定性）
        run: python3 -m pip install --quiet pyyaml
      - name: 运行 KMFA v1.5.2 taskpack fail-closed 门禁
        run: |
          set -euo pipefail
          python3 KMFA/machine/tools/validate_taskpack.py --root KMFA
          python3 KMFA/machine/tools/test_validate_taskpack_mutations.py --root KMFA
      - name: 运行全仓双平面合规校验
        run: |
          set -euo pipefail
          SCRIPT="$(find . -path '*/machine/tools/check_dual_plane_ci.py' | sort | head -1)"
          if [ -z "$SCRIPT" ]; then
            echo "FAIL: 未找到 check_dual_plane_ci.py（本仓应至少有一个双平面项目）"
            exit 1
          fi
          echo "runner: $SCRIPT"
          python3 "$SCRIPT" --root . --require-projects

      - name: 业务基线纵向切片 + 耦合治理门禁
        run: |
          set -euo pipefail
          # Owner 2026-07-26：每条业务基线端到端健康可见 + 耦合治理
          # 门禁核心：上游断点时下游不得标 healthy（防"上游断了还静默出数"）
          python3 KMFA/tools/check_baseline_slices.py
      - name: 项目成本科目映射门禁（闭环：模板每一行都要有交代）
        run: |
          set -euo pipefail
          # 拦两件"看着正常、数字是错的"：钱映射到不存在的行被静默丢掉；
          # 报表某行无人认领（既没人填也没说算不出）。
          python3 KMFA/tools/project_cost/account_map.py --root KMFA
      - name: 项目成本输入矩阵门禁
        run: |
          set -euo pipefail
          # Owner 2026-07-26：「输入缺失需要明确矩阵表格方式标注提醒我上传」
          # 门禁核心：槽位不 ready 就必须写清要 Owner 传什么、缺了挡住报表哪几行
          # ——防止矩阵悄悄退化成一张"都齐了"的表，让人误以为能出正式财务结论。
          python3 KMFA/tools/project_cost/input_matrix.py --root KMFA
      - name: kit 漂移门（副本必须与 Governance 唯一真源一致）
        run: |
          set -euo pipefail
          SCRIPT="machine/tools/check_kit_drift.py"
          [ -f "$SCRIPT" ] || { echo "FAIL: 缺少 $SCRIPT"; exit 1; }
          python3 "$SCRIPT" --root .
