# KMFA 公开 MVP 核心链路 + 高风险故障的确定性 CI 验证。
#
# 不执行真实时间 soak、观察期、等待窗口或全量回归；时间状态由 focused Fake Clock
# 测试覆盖，跨服务风险由固定 Fixture 与即时故障注入覆盖。完整回归可按需诊断，
# 不作为开发、部署、上线或下一阶段的前置条件。
name: app-e2e

on:
  # main 部署工作流以 reusable call 调用本验证；不要另起并行 push run，
  # 否则 deploy 可能在这组测试完成前晋级同一 SHA。
  workflow_call:
  pull_request:
    paths:
      - "KMFA/app/**"
      - "KMFA/machine/facts/**"
      - "KMFA/metadata/**"
      - "KMFA/taskpack/v1_4/html_uiux/kmfa_html_human_flow_audit.py"
      - ".github/workflows/app-e2e.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: KMFA/app/backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: KMFA/app/frontend/package-lock.json

      - name: 跑核心链路与高风险故障验证
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: KMFA/app/backend
        run: |
          set -euo pipefail
          python -m pip install --quiet \
            -r KMFA/app/backend/requirements.txt \
            pytest==9.1.1 httpx2==2.9.1
          python -m pytest -q \
            KMFA/app/backend/tests/test_public_entry_contract.py \
            KMFA/app/backend/tests/test_walking_skeleton.py \
            KMFA/app/backend/tests/test_secret_hygiene.py \
            KMFA/app/backend/tests/test_abuse_control.py \
            KMFA/app/backend/tests/test_resumable_upload.py \
            KMFA/app/backend/tests/test_file_security.py \
            KMFA/app/backend/tests/test_file_security_policy.py \
            KMFA/app/backend/tests/test_file_security_protocol.py \
            KMFA/app/backend/tests/test_artifact_lineage.py \
            KMFA/app/backend/tests/test_retention_backup.py
          python KMFA/machine/tools/validate_taskpack.py --root KMFA
          python KMFA/machine/tools/test_validate_taskpack_mutations.py --root KMFA
          python KMFA/machine/tools/check_dual_plane_ci.py --root . --require-projects

      # 前端不再在 runner 上预构建：Dockerfile 已改多阶段，镜像内由当次源码现建 dist
      # （「曾拿仓里旧 dist 打镜像而不自知」的教训由 Dockerfile 结构性根治，兜底退役）。
      # 前端构建失败会红在 docker build 这一步，红的语义不变。
      - name: 构建 runtime image（前端镜像内现建）
        run: |
          set -euo pipefail
          docker build -f KMFA/app/backend/Dockerfile -t kmfa-app:e2e .

      - name: 跑私有对象存储（版本 / 权限 / inventory 对账 / 回滚）
        run: |
          set -euo pipefail
          p52_state=$(mktemp -d /tmp/kmfa-p52-state.XXXXXX)
          python KMFA/app/e2e/object_storage_flow.py \
            --image kmfa-app:e2e \
            --state-dir "$p52_state" \
            --out-dir object-storage-e2e \
            --prefix kmfa-p52-ci

      - name: 跑一致性状态机（崩溃 / 超时 / 重复 / 部分成功 / 隔离）
        run: |
          set -euo pipefail
          p53_state=$(mktemp -d /tmp/kmfa-p53-state.XXXXXX)
          python KMFA/app/e2e/consistency_state_flow.py \
            --image kmfa-app:e2e \
            --state-dir "$p53_state" \
            --out-dir consistency-state-e2e \
            --prefix kmfa-p53-ci

      - name: 跑保留与恢复（全量+增量 / 空环境恢复 / 明确删除 / 不复活）
        run: |
          set -euo pipefail
          p54_state=$(mktemp -d /tmp/kmfa-p54-state.XXXXXX)
          python KMFA/app/e2e/retention_backup_restore_flow.py \
            --image kmfa-app:e2e \
            --state-dir "$p54_state" \
            --out-dir retention-backup-restore-e2e \
            --prefix kmfa-p54-ci \
            --source-commit "$GITHUB_SHA"

      - name: 跑断点上传（任意类型 / 重启续传 / 篡改 / 并发 / Flag 回滚）
        run: |
          set -euo pipefail
          p61_state=$(mktemp -d /tmp/kmfa-p61-state.XXXXXX)
          python KMFA/app/e2e/resumable_upload_flow.py \
            --image kmfa-app:e2e \
            --state-dir "$p61_state" \
            --out-dir resumable-upload-e2e \
            --container-name kmfa-p61-e2e \
            --port 18106

      - name: 装 Playwright
        run: |
          set -euo pipefail
          pip install --quiet playwright==1.60.0
          python -m playwright install --with-deps chromium

      - name: 跑文件隔离与扫描（攻击语料 / 即时故障恢复 / 浏览器提示 / 回滚）
        run: |
          set -euo pipefail
          p62_state=$(mktemp -d /tmp/kmfa-p62-state.XXXXXX)
          python KMFA/app/e2e/file_security_flow.py \
            --image kmfa-app:e2e \
            --state-dir "$p62_state" \
            --out-dir file-security-e2e \
            --prefix kmfa-p62-ci \
            --port 18107

      - name: 跑不可变版本与安全预览（血缘 / 重处理 / 浏览器 hash / 回滚）
        run: |
          set -euo pipefail
          p63_state=$(mktemp -d /tmp/kmfa-p63-state.XXXXXX)
          python KMFA/app/e2e/artifact_lineage_flow.py \
            --image kmfa-app:e2e \
            --state-dir "$p63_state" \
            --out-dir artifact-lineage-e2e \
            --prefix kmfa-p63-ci \
            --port 18108

      - name: 跑匿名恢复与 secret hygiene（会话撤销 / 泄露扫描 / 重启 / hash / Flag 回滚）
        run: |
          set -euo pipefail
          p34_state=$(mktemp -d /tmp/kmfa-p34-state.XXXXXX)
          python KMFA/app/e2e/walking_skeleton_flow.py \
            --image kmfa-app:e2e \
            --state-dir "$p34_state" \
            --out-dir walking-skeleton-e2e \
            --container-name kmfa-p34-e2e \
            --port 18099

      - name: 跑上传质量验证（固定 Fixture / 配额竞争 / 故障注入）
        run: |
          set -euo pipefail
          p64_state=$(mktemp -d /tmp/kmfa-p64-state.XXXXXX)
          python KMFA/app/e2e/upload_quality_gate.py \
            --image kmfa-app:e2e \
            --state-dir "$p64_state" \
            --out-dir upload-quality-e2e \
            --container-name kmfa-p64-e2e \
            --port 18109 \
            --fixture-samples 12 \
            --resumable resumable-upload-e2e/summary.json \
            --file-security file-security-e2e/summary.json \
            --object-storage object-storage-e2e/object-storage-oracle.json \
            --lineage artifact-lineage-e2e/summary.json

      - name: 留存证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-e2e-result
          path: |
            walking-skeleton-e2e/
            object-storage-e2e/
            consistency-state-e2e/
            retention-backup-restore-e2e/
            resumable-upload-e2e/
            file-security-e2e/
            artifact-lineage-e2e/
            upload-quality-e2e/

      - name: 收容器
        if: always()
        run: |
          docker rm -f kmfa-p34-e2e || true
          docker rm -f kmfa-p61-e2e || true
          docker rm -f kmfa-p64-e2e || true
          docker rm -f kmfa-p62-ci-app || true
          docker rm -f kmfa-p62-ci-scanner || true
          for index in {1..12}; do
            docker rm -f "kmfa-p62-ci-worker-${index}" || true
          done
          docker network rm kmfa-p62-ci-net || true
          docker network rm kmfa-p62-ci-app-net || true
          docker rm -f kmfa-p52-ci-app-a || true
          docker rm -f kmfa-p52-ci-app-b || true
          docker rm -f kmfa-p52-ci-app-rollback || true
          docker rm -f kmfa-p52-ci-pg || true
          docker rm -f kmfa-p52-ci-object || true
          docker volume rm kmfa-p52-ci-pgdata || true
          docker volume rm kmfa-p52-ci-objectdata || true
          docker network rm kmfa-p52-ci-net || true
          docker rm -f kmfa-p53-ci-pg || true
          docker rm -f kmfa-p53-ci-object || true
          docker volume rm kmfa-p53-ci-pgdata || true
          docker volume rm kmfa-p53-ci-objectdata || true
          docker network rm kmfa-p53-ci-net || true
          for label in source target final; do
            docker rm -f "kmfa-p54-ci-${label}-app" || true
            docker rm -f "kmfa-p54-ci-${label}-pg" || true
            docker rm -f "kmfa-p54-ci-${label}-object" || true
            docker volume rm "kmfa-p54-ci-${label}-pgdata" || true
            docker volume rm "kmfa-p54-ci-${label}-objectdata" || true
            docker network rm "kmfa-p54-ci-${label}-net" || true
          done
