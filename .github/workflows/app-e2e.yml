# KMFA 公共 App Shell + 私有经营 App 真数据端到端回归基线。
#
# 验收原文：「升级 kmfa_html_human_flow_audit.py 覆盖 App：登录→首页→检查板→成本页→
# 差异处理→影响预览→重跑→报告导出；全流 PASS；**作为 App 回归基线入 CI**」。
#
# 本工作流真起服务、真开页面、真点按钮（差异处理会真写一条决策、重跑会真跑四层链、
# 报告导出会真下载三个文件），任何一步 FAIL 就红。**不拿 /healthz 当通过依据。**
name: app-e2e

on:
  # main 部署工作流以 reusable call 调用本 Gate；不要另起并行 push run，
  # 否则 deploy 可能在这组测试完成前晋级同一 SHA。
  workflow_call:
  pull_request:
    paths:
      - "KMFA/app/**"
      - "KMFA/machine/facts/**"
      - "KMFA/metadata/**"
      - "KMFA/taskpack/v1_4/html_uiux/kmfa_html_human_flow_audit.py"
      - ".github/workflows/app-e2e.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            KMFA/app/backend/requirements.txt
            KMFA/skills/每日资金/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: KMFA/app/frontend/package-lock.json

      - name: 跑后端与治理阻断门禁
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: KMFA/app/backend
        run: |
          set -euo pipefail
          python -m pip install --quiet \
            -r KMFA/app/backend/requirements.txt \
            -r KMFA/skills/每日资金/requirements.txt \
            pytest==9.1.1 httpx2==2.9.1
          python -m pytest -q KMFA/app/backend/tests
          PYTHONPATH=KMFA/skills/每日资金 python -m pytest -q KMFA/skills/每日资金/tests/test_daily_funds_contract.py
          python KMFA/machine/tools/validate_taskpack.py --root KMFA
          python KMFA/machine/tools/test_validate_taskpack_mutations.py --root KMFA
          python KMFA/machine/tools/check_dual_plane_ci.py --root . --require-projects

      # ``dist`` 是生产镜像的一部分，必须由锁定依赖从同一提交源码重建后
      # 保持零差异；否则拒绝把旧前端静态产物烧进镜像。把 Node 构建放在有
      # 容量与缓存保障的 CI，而不是小磁盘 Coolify 构建宿主。
      - name: 验证受检前端静态产物与当前源码一致
        run: |
          set -euo pipefail
          npm ci --prefix KMFA/app/frontend --ignore-scripts
          npm run build --prefix KMFA/app/frontend
          git diff --exit-code -- KMFA/app/frontend/dist

      - name: 起 App（零挂载，代码与受检前端产物均烧在镜像里）
        run: |
          set -euo pipefail
          docker build -f KMFA/app/backend/Dockerfile -t kmfa-app:e2e .
          mkdir -p /tmp/kmfa-state
          docker run -d --name kmfa-e2e -p 18098:8000 \
            -e KMFA_PUBLIC_INDEXING_ENABLED=1 \
            -e KMFA_WALKING_SKELETON_ENABLED=1 \
            -v /tmp/kmfa-state:/var/lib/kmfa/state kmfa-app:e2e
          for _ in {1..60}; do
            curl -sf http://localhost:18098/healthz >/dev/null && break
            sleep 2
          done
          curl -sf http://localhost:18098/healthz >/dev/null || {
            echo "::error::App 未起来"; docker logs kmfa-e2e; exit 1; }

      # 通用技能镜像不随每日资金/App 发布在小磁盘生产主机重建，但其
      # Dockerfile 仍必须在容量充足的 CI 真实构建，不能把“沿用旧镜像”
      # 变成未验证的死代码。
      - name: 构建通用技能运行时（CI 容量门）
        run: |
          set -euo pipefail
          docker build -f KMFA/deploy/skills-runtime/Dockerfile -t kmfa-skills:e2e .

      - name: 验证每日资金独立容器（镜像、cron、健康检查）
        run: |
          set -euo pipefail
          docker build -f KMFA/skills/每日资金/Dockerfile -t kmfa-daily-funds:e2e .
          docker run -d --name kmfa-daily-funds-e2e kmfa-daily-funds:e2e
          for _ in {1..30}; do
            if docker exec kmfa-daily-funds-e2e /opt/daily-funds/healthcheck.sh; then break; fi
            sleep 1
          done
          docker exec kmfa-daily-funds-e2e /opt/daily-funds/healthcheck.sh
          docker exec kmfa-daily-funds-e2e sh -c '
            test -f /etc/cron.d/daily-funds &&
            test -x /opt/daily-funds/scripts/run_cron_job.sh &&
            grep -Fq "/opt/daily-funds/scripts/run_cron_job.sh poll" /etc/cron.d/daily-funds &&
            grep -Fq "exec python3 /opt/daily-funds/scripts/run_daily_funds.py \"\$@\"" /opt/daily-funds/scripts/run_cron_job.sh &&
            command -v tesseract &&
            command -v pdfinfo &&
            command -v pdftoppm &&
            tesseract --list-langs | grep -Fxq chi_sim &&
            test -r /run/daily-funds-cron.pid &&
            pid=$(cat /run/daily-funds-cron.pid) &&
            test -r "/proc/$pid/comm" &&
            test "$(cat "/proc/$pid/comm")" = cron
          '

      - name: 跑结构化数据库（双节点 / 事务 / 并发 / 迁移 / 恢复）
        run: |
          set -euo pipefail
          p51_state=$(mktemp -d /tmp/kmfa-p51-state.XXXXXX)
          python KMFA/app/e2e/structured_database_flow.py \
            --image kmfa-app:e2e \
            --state-dir "$p51_state" \
            --out-dir structured-database-e2e \
            --prefix kmfa-p51-ci

      - name: 跑私有对象存储（版本 / 权限 / inventory 对账 / 回滚）
        run: |
          set -euo pipefail
          p52_state=$(mktemp -d /tmp/kmfa-p52-state.XXXXXX)
          python KMFA/app/e2e/object_storage_flow.py \
            --image kmfa-app:e2e \
            --state-dir "$p52_state" \
            --out-dir object-storage-e2e \
            --prefix kmfa-p52-ci

      - name: 跑一致性状态机（崩溃 / 超时 / 重复 / 部分成功 / 隔离）
        run: |
          set -euo pipefail
          p53_state=$(mktemp -d /tmp/kmfa-p53-state.XXXXXX)
          python KMFA/app/e2e/consistency_state_flow.py \
            --image kmfa-app:e2e \
            --state-dir "$p53_state" \
            --out-dir consistency-state-e2e \
            --prefix kmfa-p53-ci

      - name: 跑保留与恢复（全量+增量 / 空环境恢复 / 明确删除 / 不复活）
        run: |
          set -euo pipefail
          p54_state=$(mktemp -d /tmp/kmfa-p54-state.XXXXXX)
          python KMFA/app/e2e/retention_backup_restore_flow.py \
            --image kmfa-app:e2e \
            --state-dir "$p54_state" \
            --out-dir retention-backup-restore-e2e \
            --prefix kmfa-p54-ci \
            --source-commit "$GITHUB_SHA"

      - name: 装 Playwright
        run: |
          set -euo pipefail
          npm ci --prefix KMFA/app/frontend --ignore-scripts
          pip install --quiet playwright==1.60.0
          python -m playwright install --with-deps chromium firefox webkit

      - name: 验证已删除的 workspace 页面不会复活
        run: |
          set -euo pipefail
          python KMFA/app/e2e/workspace_removal_flow.py \
            --base-url http://localhost:18098 \
            --out-dir workspace-removal-e2e

      - name: 跑每日资金页面交互（待发布图表 / 阈值 / 三态 / 脱敏）
        run: |
          set -euo pipefail
          python KMFA/app/e2e/daily_funds_page_flow.py \
            --out-dir daily-funds-page-e2e

      # 真浏览器真点击。纯文本断言看不见 CSP 拦截——脚本被拒的时刻，
      # 字符串早已在 HTML 里了。2026-07-29「排序功能无法使用」就是这么漏过去的。
      - name: 跑项目成本页交互（CSP 违规 / 点表头真排序 / 重算有回话）
        run: |
          set -euo pipefail
          python KMFA/app/e2e/project_cost_page_flow.py \
            --image kmfa-app:e2e \
            --out-dir project-cost-page-e2e \
            --container-name kmfa-cost-e2e \
            --port 18106

      - name: 跑私有经营 App 全流端到端
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, sys
          src = pathlib.Path("KMFA/taskpack/v1_4/html_uiux/kmfa_html_human_flow_audit.py").read_text(encoding="utf-8")
          src = src.replace("executable_path=CHROMIUM, ", "")
          sys.argv = ["audit", "--app-url", "http://localhost:18098", "--out", "e2e_result.csv"]
          exec(compile(src, "audit", "exec"))
          PY

      - name: 打印逐步结果
        if: always()
        run: |
          python - <<'PY'
          import csv, pathlib
          p = pathlib.Path("e2e_result.csv")
          if not p.exists():
              print("未产出结果文件"); raise SystemExit
          for r in list(csv.reader(p.open(encoding="utf-8-sig")))[1:]:
              print(f"{'PASS' if r[6]=='PASS' else 'FAIL'}  [{r[1]}]  {r[4][:30]}  {r[7][:90]}")
          PY

      - name: 留存证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-e2e-result
          path: |
            e2e_result.csv
            workspace-removal-e2e/
            daily-funds-page-e2e/
            structured-database-e2e/
            object-storage-e2e/
            consistency-state-e2e/
            retention-backup-restore-e2e/

      - name: 收容器
        if: always()
        run: |
          docker rm -f kmfa-e2e || true
          docker rm -f kmfa-daily-funds-e2e || true
          docker rm -f kmfa-p51-ci-app-a || true
          docker rm -f kmfa-p51-ci-app-b || true
          docker rm -f kmfa-p51-ci-app-c || true
          docker rm -f kmfa-p51-ci-pg || true
          docker volume rm kmfa-p51-ci-pgdata || true
          docker network rm kmfa-p51-ci-net || true
          docker rm -f kmfa-p52-ci-app-a || true
          docker rm -f kmfa-p52-ci-app-b || true
          docker rm -f kmfa-p52-ci-app-rollback || true
          docker rm -f kmfa-p52-ci-pg || true
          docker rm -f kmfa-p52-ci-object || true
          docker volume rm kmfa-p52-ci-pgdata || true
          docker volume rm kmfa-p52-ci-objectdata || true
          docker network rm kmfa-p52-ci-net || true
          docker rm -f kmfa-p53-ci-pg || true
          docker rm -f kmfa-p53-ci-object || true
          docker volume rm kmfa-p53-ci-pgdata || true
          docker volume rm kmfa-p53-ci-objectdata || true
          docker network rm kmfa-p53-ci-net || true
          for label in source target final; do
            docker rm -f "kmfa-p54-ci-${label}-app" || true
            docker rm -f "kmfa-p54-ci-${label}-pg" || true
            docker rm -f "kmfa-p54-ci-${label}-object" || true
            docker volume rm "kmfa-p54-ci-${label}-pgdata" || true
            docker volume rm "kmfa-p54-ci-${label}-objectdata" || true
            docker network rm "kmfa-p54-ci-${label}-net" || true
          done

  # This manual-only job is a one-run real-source oracle for the isolated
  # receipt/payment observation.  It does not emit attachment bytes, OCR text,
  # account identifiers, source names, or monetary values; the terminal
  # receipt is limited to status and coverage counts.  It is not part of the
  # reusable main deployment gate.
  raw-observation-verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DAILY_FUNDS_GROUP_ID: ${{ secrets.DAILY_FUNDS_GROUP_ID }}
      DAILY_FUNDS_SENDER_ID: ${{ secrets.DAILY_FUNDS_SENDER_ID }}
      DAILY_FUNDS_GIT_SSH_KEY_B64: ${{ secrets.DAILY_FUNDS_GIT_SSH_KEY_B64 }}
      DAILY_FUNDS_OCR_ENABLED: "1"
      DAILY_FUNDS_OCR_MIN_CONFIDENCE: "0.98"
    steps:
      - uses: actions/checkout@v4

      - name: Re-open private raw authority and verify chart-only observation
        shell: bash
        run: |
          set -euo pipefail
          docker build -f KMFA/skills/每日资金/Dockerfile -t kmfa-daily-funds:raw-observation .
          docker run --rm \
            -e DAILY_FUNDS_GROUP_ID \
            -e DAILY_FUNDS_SENDER_ID \
            -e DAILY_FUNDS_GIT_SSH_KEY_B64 \
            -e DAILY_FUNDS_OCR_ENABLED \
            -e DAILY_FUNDS_OCR_MIN_CONFIDENCE \
            --entrypoint /bin/sh \
            kmfa-daily-funds:raw-observation -ec '
              python3 - <<"PY"
              import json
              from daily_funds.config import DailyFundsConfig
              from daily_funds.ingestion import GitSparseWriter, IngestionError
              from daily_funds.runtime import DailyFundsRuntime

              config = DailyFundsConfig.from_env()
              try:
                  audit = GitSparseWriter(config).audit_raw_archive()
              except IngestionError as exc:
                  print(json.dumps({
                      "raw_archive_status": "FAILED",
                      "machine_code": exc.code,
                  }, ensure_ascii=True, sort_keys=True))
                  raise SystemExit("RAW_ARCHIVE_AUDIT_DIAGNOSTIC_FAILED")

              payload = DailyFundsRuntime(config)._write_cashflow_observation(audit.verified_attachments)
              coverage = payload.get("source_coverage") if isinstance(payload, dict) else None
              if not isinstance(coverage, dict):
                  raise SystemExit("CASHFLOW_OBSERVATION_RECEIPT_INVALID")
              result = {
                  "raw_archive_status": "VERIFIED",
                  "occurrence_count": audit.occurrence_count,
                  "batch_count": audit.batch_count,
                  "status": payload.get("status"),
                  "machine_code": payload.get("machine_code"),
                  "eligible_documents": coverage.get("eligible_documents"),
                  "parsed_documents": coverage.get("parsed_documents"),
                  "rejected_documents": coverage.get("rejected_documents"),
                  "distinct_business_days": coverage.get("distinct_business_days"),
                  "point_count": len(payload.get("points", [])),
              }
              print(json.dumps(result, ensure_ascii=True, sort_keys=True))
              if result["status"] != "VERIFIED" or result["machine_code"] != "CASHFLOW_OBSERVATION_VERIFIED":
                  raise SystemExit("CASHFLOW_OBSERVATION_NOT_VERIFIED")
              PY
            '
