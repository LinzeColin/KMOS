          def fail(code: str) -> None:
              print(f"daily_funds_worker_logs={code}")
              raise SystemExit(1)

          try:
              payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              fail("CONTROL_RESPONSE_INVALID")
          while isinstance(payload, dict) and isinstance(payload.get("data"), dict):
              payload = payload["data"]
          if not isinstance(payload, dict):
              fail("CONTROL_RESPONSE_INVALID")
          if (
              payload.get("uuid") != sys.argv[2]
              or payload.get("name") != "kmfa-kmos-p1"
              or payload.get("build_pack") != "dockercompose"
          ):
              fail("TARGET_UNEXPECTED")
          print("daily_funds_worker_logs_target=VERIFIED")
          PY

          set +e
          code="$(curl -sS -o "$log_file" -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" "$BASE/api/v1/applications/$APP/logs?lines=200&service=daily-funds" \
            2>"$curl_error_file")"
          curl_exit=$?
          set -e
          python3 "KMFA/skills/每日资金/scripts/summarize_coolify_logs.py" \
            --input "$log_file" \
            --http-status "$code" \
            --curl-exit "$curl_exit"

      # The public route targets the ``app`` compose service, while the
