          test "$app_status" = "200" || { echo "daily_funds_app_logs=CONTROL_UNAVAILABLE"; exit 1; }
          python3 - "$app_file" "$APP" <<'PY'
          import json
          import sys
          from pathlib import Path

          def fail(code: str) -> None:
              print(f"daily_funds_app_logs={code}")
              raise SystemExit(1)

          try:
              payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
