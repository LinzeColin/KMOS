      # Coolify documents force=true as a no-cache rebuild. Normal Compose
      # deployment preserves named volumes, and this path rebuilds the services
      # with build blocks while the skills image remains a static image source.
      # It never writes custom Compose commands, so platform configuration stays
      # free of command payloads.
      - name: 受控强制重建每日资金恢复目标
        if: inputs.mode == 'daily-funds-recovery-force-rebuild'
        run: |
          set -euo pipefail
