# Coolify 运维面：让 agent 自己管部署，不再每件事都找 Owner。
#
# 为什么存在：Owner 2026-07-26「你自己搞 coolify 的事情吧，我也不懂」。
# Coolify 令牌只存在于仓库 secrets，**永不经人手**；本 workflow 在 Actions 内用它操作，
# 只回显非秘密字段（应用名/uuid/环境变量**名**/部署状态）。
#
# ⚠ 本仓是 PUBLIC，Actions 日志公开可读：任何秘密值一律 mask + 绝不 print。
#
# provision-backup-key 模式（关键设计）：
#   在 runner 内**当场生成** ed25519 密钥对 → 私钥直接经 API 写进 Coolify 环境变量
#   → 只把**公钥**打进日志（公钥本就是公开物）。
#   私钥全程不落任何人手、不入任何仓库、不进对话记录——绕开「谁来粘密钥」这个死结。
name: coolify-ops

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "list=资源与环境变量名 | deployment-identity=已配置源码身份(不等同于运行镜像) | enable-source-commit-build=仅开启 Coolify 构建源码身份并回读 | daily-funds-access-audit=仅 GET 审计每日资金 Access 能力 | public-dashboard=Owner 批准的 KMFA 无登录公开面 | daily-funds-history-probe-bridge=短时服务身份触发固定历史探针并自动撤销 | daily-funds-history-probe-cleanup=按唯一 run tag 清理遗留短时身份 | flags=非秘密开关的值(诊断用) | provision-backup-key=注入备份密钥 | redeploy=重新部署 | deployments=最近部署 | cancel-deployment=取消卡死的指定部署 | logs=容器日志 | testing-safe-mode=测试期安全态(清群机器人+投递关) | set-flag=改一个非秘密开关 | sync-access-aud=同步 Access audiences | sync-project-cost-secrets=同步项目成本只读源与工资密码 | sync-daily-funds-secrets=同步每日资金专用凭据 | project-cost-diagnostic=加密回传项目成本全量诊断 | sync-dingtalk=把钉钉凭据从仓库secret同步进Coolify | exec=容器内只读诊断"
        required: true
        type: choice
        options: [list, deployment-identity, enable-source-commit-build, daily-funds-access-audit, public-dashboard, daily-funds-history-probe-bridge, daily-funds-history-probe-cleanup, flags, set-flag, sync-access-aud, sync-project-cost-secrets, sync-daily-funds-secrets, project-cost-diagnostic, testing-safe-mode, delivery-personal-on, provision-backup-key, sync-dingtalk, redeploy, deployments, deployment-log, cancel-deployment, logs, exec]
      app_uuid:
        description: "目标应用 uuid（enable-source-commit-build / provision-backup-key / redeploy 必填；先用 list 查）"
        required: false
        type: string
      command:
        description: "exec 模式的只读诊断命令；deployment-log / cancel-deployment 模式填写 deployment uuid"
        required: false
        type: string
      bridge_run_tag:
        description: "仅 daily-funds-history-probe-cleanup：精确的 GitHub run-id-attempt（例如 123-1）"
        required: false
        default: ""
        type: string
      flag_key:
        description: "set-flag 的键（只允许非秘密开关，如 KMFA_DELIVERY_ENABLED）"
        required: false
        type: string
      flag_value:
        description: "set-flag 的值"
        required: false
        type: string

permissions:
  contents: read

jobs:
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.actor == 'LinzeColin'
    env:
      BASE: ${{ secrets.COOLIFY_BASE_URL }}
      TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
      MODE: ${{ inputs.mode }}
      APP: ${{ inputs.app_uuid }}
    steps:
      - name: 检出诊断代码
        if: inputs.mode == 'project-cost-diagnostic' || inputs.mode == 'logs' || inputs.mode == 'daily-funds-access-audit' || inputs.mode == 'public-dashboard' || inputs.mode == 'daily-funds-history-probe-bridge' || inputs.mode == 'daily-funds-history-probe-cleanup'
        uses: actions/checkout@v4

      - name: 安装项目成本诊断依赖
        if: inputs.mode == 'project-cost-diagnostic'
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            -r "KMFA/skills/项目成本表/requirements.txt"

      # 私密工资与业务快照不得出现在公开仓库或 Actions 明文 artifact 中。
      # command 输入在此模式下仅承载一次性 X.509 公钥证书（公钥不是秘密）；
      # 完整诊断结果用该证书加密，本机持有的私钥从不进入 GitHub。
      - name: 全量项目成本诊断（仅输出非敏感计数）
        if: inputs.mode == 'project-cost-diagnostic'
        env:
          GH_TOKEN: ${{ secrets.PRIVATE_DB_TOKEN }}
          KMFA_PAYROLL_PASSWORD: ${{ secrets.KMFA_PAYROLL_PASSWORD }}
          DIAGNOSTIC_CERT_B64: ${{ inputs.command }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || {
            echo "仓库缺 PRIVATE_DB_TOKEN"; exit 1; }
          test -n "${KMFA_PAYROLL_PASSWORD:-}" || {
            echo "仓库缺 KMFA_PAYROLL_PASSWORD"; exit 1; }
          test -n "${DIAGNOSTIC_CERT_B64:-}" || {
            echo "project-cost-diagnostic 需要在 command 提供 X.509 公钥证书 base64"; exit 1; }
          echo "::add-mask::$GH_TOKEN"
          echo "::add-mask::$KMFA_PAYROLL_PASSWORD"
          printf '%s' "$DIAGNOSTIC_CERT_B64" \
            | base64 --decode > "$RUNNER_TEMP/project-cost-diagnostic-cert.pem"
          openssl x509 -in "$RUNNER_TEMP/project-cost-diagnostic-cert.pem" \
            -noout -checkend 3600
          python3 - <<'PY'
          import json
          import os
          import sys
          import tempfile
          from pathlib import Path

          repo = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          skill = repo / "KMFA" / "skills" / "项目成本表"
          sys.dont_write_bytecode = True
          sys.path.insert(0, str(skill / "src"))
          sys.path.insert(0, str(skill / "scripts"))
          sys.path.insert(0, str(repo))

          from project_cost_table.operational import (
              ProjectCostError,
              _decimal_units,
              _open_payroll_workbook,
              _payroll_header,
              _payroll_period,
              build_snapshot,
              cents,
              normalize_text,
              parse_employer_burden_workbooks,
          )
          from run_private_refresh import fetch_manifest

          def private_payroll_inspection(path):
              workbook = _open_payroll_workbook(
                  path,
                  "KMFA_PAYROLL_PASSWORD",
              )
              try:
                  period = _payroll_period(path, workbook)
                  result = {
                      "source_member": path.name,
                      "parsed_period": period,
                      "sheet_names": list(workbook.sheetnames),
                      "employee_rows": [],
                  }
                  detail_sheets = [
                      sheet
                      for sheet in workbook.worksheets
                      if "分部门" in sheet.title
                  ]
                  for sheet in detail_sheets:
                      header_row, headers = _payroll_header(sheet)
                      name_index = headers["姓名"]
                      department_index = headers.get(
                          "实际部门",
                          headers["部门"],
                      )
                      company_index = headers.get("公司")
                      gross_index = headers["应计工资小计"]
                      outside_index = headers.get("实出勤天-厂外")
                      inside_index = headers.get("实出勤天-厂内")
                      diagnostic_component_indexes = {
                          header: index
                          for header, index in headers.items()
                          if any(
                              marker in header
                              for marker in (
                                  "工资",
                                  "薪",
                                  "出勤",
                                  "天",
                                  "岗位",
                                  "基本",
                                  "绩效",
                                  "加班",
                                  "补贴",
                                  "奖金",
                                  "标准",
                                  "基数",
                              )
                          )
                          and not any(
                              prohibited in header
                              for prohibited in (
                                  "身份证",
                                  "银行卡",
                                  "账号",
                                  "电话",
                                  "手机",
                              )
                          )
                      }
                      for row in sheet.iter_rows(
                          min_row=header_row + 1,
                          values_only=True,
                      ):
                          employee = normalize_text(
                              row[name_index]
                              if name_index < len(row)
                              else None
                          )
                          gross = cents(
                              row[gross_index]
                              if gross_index < len(row)
                              else None
                          )
                          if not employee or gross is None or gross <= 0:
                              continue
                          approved_days = 0
                          if (
                              outside_index is not None
                              and outside_index < len(row)
                          ):
                              approved_days += _decimal_units(
                                  row[outside_index]
                              )
                          if (
                              inside_index is not None
                              and inside_index < len(row)
                          ):
                              approved_days += _decimal_units(
                                  row[inside_index]
                              )
                          result["employee_rows"].append(
                              {
                                  "employee": employee,
                                  "company": normalize_text(
                                      row[company_index]
                                      if company_index is not None
                                      and company_index < len(row)
                                      else None
                                  ),
                                  "department": normalize_text(
                                      row[department_index]
                                      if department_index < len(row)
                                      else None
                                  ),
                                  "gross_cents": gross,
                                  "approved_days": str(approved_days),
                                  "compensation_fields": {
                                      header: (
                                          value
                                          if value is None
                                          or isinstance(
                                              value,
                                              (
                                                  str,
                                                  int,
                                                  float,
                                                  bool,
                                              ),
                                          )
                                          else str(value)
                                      )
                                      for header, index in (
                                          diagnostic_component_indexes.items()
                                      )
                                      for value in (
                                          row[index]
                                          if index < len(row)
                                          else None,
                                      )
                                      if value not in (None, "")
                                  },
                              }
                          )
                  return result
              finally:
                  workbook.close()

          def private_employer_burden_inspection(paths, input_root, run):
              records_by_period, _, reviews, metadata = (
                  parse_employer_burden_workbooks(
                      paths,
                      (input_root,),
                      year=run["year"],
                      as_of=run["as_of"],
                      password_env="KMFA_PAYROLL_PASSWORD",
                  )
              )
              return {
                  "metadata": metadata,
                  "review_types": sorted(
                      {
                          str(review.get("type") or "")
                          for review in reviews
                          if review.get("type")
                      }
                  ),
                  "periods": [
                      {
                          "period": period,
                          "employee_rows": [
                              {
                                  "entity": entity,
                                  "employee": employee,
                                  "amount_cents": int(record["amount_cents"]),
                                  "department": record.get("department"),
                                  "source_sheet": record.get("source_sheet"),
                              }
                              for (entity, employee), record in sorted(
                                  records.items()
                              )
                          ],
                      }
                      for period, records in sorted(
                          records_by_period.items()
                      )
                  ],
              }

          try:
              with tempfile.TemporaryDirectory(
                  prefix="kmfa-project-cost-diagnostic-",
                  dir=os.environ["RUNNER_TEMP"],
              ) as temporary:
                  staging = Path(temporary)
                  manifest, manifest_sha256 = fetch_manifest(
                      "KMFA_MetaData/project_cost/"
                      "diagnostic_input_manifest_v006.json",
                      staging,
                  )
                  run = manifest["run"]
                  input_root = staging / "input"
                  employer_burden_paths = tuple(
                      input_root / path
                      for path in run["employer_burden_paths"]
                  )
                  snapshot = build_snapshot(
                      (input_root / run["data_root"],),
                      year=run["year"],
                      as_of=run["as_of"],
                      ocr_jsonl=input_root / run["ocr_path"],
                      payroll_workbooks=tuple(
                          input_root / path for path in run["payroll_paths"]
                      ),
                      employer_burden_workbooks=employer_burden_paths,
                      attendance_roots=tuple(
                          input_root / path
                          for path in run["attendance_roots"]
                      ),
                      payroll_password_env="KMFA_PAYROLL_PASSWORD",
                      private_input_manifest_sha256=manifest_sha256,
                  )
                  # This extension can contain employee names and wage
                  # components.  It exists only inside the one-day,
                  # certificate-encrypted diagnostic artifact and is never
                  # printed to Actions logs or written to the repository.
                  snapshot["private_diagnostic_extension"] = {
                      "contains_personal_data": True,
                      "plaintext_publication_prohibited": True,
                      "payroll_workbooks": [
                          private_payroll_inspection(input_root / path)
                          for path in run["payroll_paths"]
                      ],
                      "employer_burden": (
                          private_employer_burden_inspection(
                              employer_burden_paths,
                              input_root,
                              run,
                          )
                      ),
                  }
                  private_json = Path(os.environ["RUNNER_TEMP"]) / (
                      "project-cost-diagnostic-private.json"
                  )
                  private_json.write_text(
                      json.dumps(
                          snapshot,
                          ensure_ascii=False,
                          sort_keys=True,
                          separators=(",", ":"),
                      ),
                      encoding="utf-8",
                  )
                  provisional_over_70 = 0
                  formal_over_70 = 0
                  for project in snapshot["projects"]:
                      revenue = project.get("effective_revenue_cents")
                      incurred = project.get("job_cost_incurred_cents")
                      formal_cost = project.get("gross_margin_cost_basis_cents")
                      if revenue and incurred is not None:
                          provisional_over_70 += (
                              (revenue - incurred) * 10000 // revenue > 7000
                          )
                      if revenue and formal_cost is not None:
                          formal_over_70 += (
                              (revenue - formal_cost) * 10000 // revenue > 7000
                          )
                  review_summary = snapshot.get("review_summary") or {}
                  reviews = review_summary.get("by_severity") or {}
                  coverage = snapshot.get("coverage") or {}
                  print(json.dumps({
                      "status": "DIAGNOSTIC_COMPLETE",
                      "project_count": snapshot.get("project_count"),
                      "event_count": len(snapshot.get("events") or []),
                      "p0_review_count": reviews.get("P0", 0),
                      "p1_review_count": reviews.get("P1", 0),
                      "p2_review_count": reviews.get("P2", 0),
                      "labor_wage_event_count": coverage.get(
                          "labor_wage_component_event_count"
                      ),
                      "labor_burden_event_count": coverage.get(
                          "labor_employer_burden_event_count"
                      ),
                      "provisional_margin_over_70_count": provisional_over_70,
                      "formal_margin_over_70_count": formal_over_70,
                  }, ensure_ascii=False, sort_keys=True))
          except ProjectCostError as exc:
              print(json.dumps({
                  "status": "FAIL",
                  "error_code": exc.code,
              }, sort_keys=True), file=sys.stderr)
              raise SystemExit(2)
          except Exception as exc:
              print(json.dumps({
                  "status": "FAIL",
                  "error_type": type(exc).__name__,
              }, sort_keys=True), file=sys.stderr)
              raise SystemExit(3)
          PY
          openssl cms -encrypt -binary -aes256 \
            -in "$RUNNER_TEMP/project-cost-diagnostic-private.json" \
            -outform DER \
            -out "$RUNNER_TEMP/project-cost-diagnostic-private.p7m" \
            "$RUNNER_TEMP/project-cost-diagnostic-cert.pem"
          rm -f \
            "$RUNNER_TEMP/project-cost-diagnostic-private.json" \
            "$RUNNER_TEMP/project-cost-diagnostic-cert.pem"

      - name: 上传仅本机可解密的项目成本诊断
        if: inputs.mode == 'project-cost-diagnostic'
        uses: actions/upload-artifact@v4
        with:
          name: project-cost-diagnostic-encrypted
          path: ${{ runner.temp }}/project-cost-diagnostic-private.p7m
          if-no-files-found: error
          retention-days: 1

      - name: 列出资源与环境变量名（零秘密值）
        if: inputs.mode == 'list'
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $TOKEN" "$BASE/api/v1/applications" -o "$RUNNER_TEMP/apps.json"
          python3 - <<'PY'
          import json, os
          p = os.path.join(os.environ["RUNNER_TEMP"], "apps.json")
          d = json.load(open(p, encoding="utf-8"))
          apps = d if isinstance(d, list) else d.get("data") or d.get("applications") or []
          print(f"应用数={len(apps)}")
          for a in apps:
              print(f"  name={a.get('name')!r} uuid={a.get('uuid')} status={a.get('status')} fqdn={a.get('fqdn')}")
          PY
          # 环境变量：只打名字，绝不打值
          if [ -n "${APP:-}" ]; then
            curl -fsSL -H "Authorization: Bearer $TOKEN" "$BASE/api/v1/applications/$APP/envs" -o "$RUNNER_TEMP/envs.json"
            python3 - <<'PY'
          import json, os
          d = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "envs.json"), encoding="utf-8"))
          envs = d if isinstance(d, list) else d.get("data") or []
          print(f"环境变量数={len(envs)}（只列名）")
          for e in envs:
              print("  " + str(e.get("key")))
          PY
          fi

      # Coolify 的 application GET 是配置面：它能证明被配置的 Git revision，
      # 但不是运行容器/image digest 的 Oracle。后者没有可信回执时必须保留
      # UNKNOWN，不能把这个结果写成“生产已部署”。响应可能含命令、域名和
      # 手工 webhook secret，故只在 runner 临时文件读取三项白名单字段。
      - name: 核对已配置源码身份（零秘密值）
        if: inputs.mode == 'deployment-identity'
        run: |
          set -euo pipefail
          test -n "${APP:-}" || { echo "需要 app_uuid（先跑 list）"; exit 1; }
          curl -fsSL -H "Authorization: Bearer $TOKEN" \
            "$BASE/api/v1/applications/$APP" -o "$RUNNER_TEMP/application.json"
          python3 - <<'PY'
          import json
          import os
          import re
          import sys

          with open(
              os.path.join(os.environ["RUNNER_TEMP"], "application.json"),
              encoding="utf-8",
          ) as handle:
              payload = json.load(handle)

          # API v1 returns an object today; accept the common wrapper without
          # recursively searching, because any nested value can be sensitive.
          application = payload.get("data") if isinstance(payload, dict) else None
          if not isinstance(application, dict):
              application = payload
          if not isinstance(application, dict):
              print("configured_source_revision=UNKNOWN")
              print("configured_source_identity_status=UNKNOWN")
              sys.exit(1)

          app_uuid = application.get("uuid")
          branch = application.get("git_branch")
          revision = application.get("git_commit_sha")
          repository = application.get("git_repository")
          expected_uuid = os.environ.get("APP", "")
          expected_repository = "LinzeColin/KMOS"
          repository_text = str(repository or "").rstrip("/")
          repository_ok = (
              repository_text.endswith(expected_repository)
              or repository_text.endswith(expected_repository + ".git")
          )
          revision_ok = isinstance(revision, str) and re.fullmatch(
              r"[0-9a-f]{40}", revision.lower()
          ) is not None
          branch_ok = branch == "main"
          uuid_ok = app_uuid == expected_uuid

          # Never print repository, URL, command, config or any secret-bearing
          # field.  A full SHA and the literal main are the complete public
          # evidence this mode is allowed to expose.
          if uuid_ok and repository_ok and branch_ok and revision_ok:
              print(f"configured_source_revision={revision.lower()}")
              print("configured_source_branch=main")
              print("configured_source_identity_status=VERIFIED_CONFIGURATION_ONLY")
              sys.exit(0)

          print("configured_source_revision=UNKNOWN")
          print("configured_source_identity_status=UNKNOWN")
          sys.exit(1)
          PY

      # Coolify 默认不把 SOURCE_COMMIT 放进 Docker 构建；那会令 worker/App
      # 只能报告 UNKNOWN，不能把同一镜像层的源码身份和 GitHub deploy run
      # 绑定。此模式是唯一允许的配置写入：精确 PATCH 一个非秘密布尔值，
      # 随即用 GET 回读。它不改环境变量、域名、卷、认证或业务数据。
      - name: 开启构建源码身份并只读回执
        if: inputs.mode == 'enable-source-commit-build'
        run: |
          set -euo pipefail
          test "${GITHUB_REF:-}" = "refs/heads/main" || {
            echo "source_commit_build_setting=MAIN_REF_REQUIRED"; exit 1; }
          test -n "${APP:-}" || {
            echo "source_commit_build_setting=APP_UUID_REQUIRED"; exit 1; }
          python3 - <<'PY' > "$RUNNER_TEMP/source-commit-build.json"
          import json
          print(json.dumps({"include_source_commit_in_build": True}))
          PY
          code=$(curl -sS -o "$RUNNER_TEMP/source-commit-build.patch.json" -w '%{http_code}' \
            -X PATCH -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data @"$RUNNER_TEMP/source-commit-build.json" \
            "$BASE/api/v1/applications/$APP" || true)
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            # The response can contain provider-specific details.  The public
            # receipt deliberately exposes only whether the requested setting
            # field itself was rejected, never the response body or values.
          python3 - <<'PY'
          import json
          import os

          try:
              response = json.load(open(
                  os.path.join(os.environ["RUNNER_TEMP"], "source-commit-build.patch.json"),
                  encoding="utf-8",
              ))
          except (OSError, ValueError, TypeError):
              print("source_commit_build_error_fields=UNPARSEABLE")
              raise SystemExit(0)

          errors = response.get("errors") if isinstance(response, dict) else None
          if not isinstance(errors, dict) or not errors:
              print("source_commit_build_error_fields=NONE")
          elif "include_source_commit_in_build" in errors:
              print("source_commit_build_error_fields=INCLUDE_SOURCE_COMMIT_FIELD")
          else:
              print("source_commit_build_error_fields=OTHER_FIELD")
          PY
            echo "source_commit_build_setting=PATCH_HTTP_$code"
            exit 1
          fi
          curl -fsSL -H "Authorization: Bearer $TOKEN" \
            "$BASE/api/v1/applications/$APP" -o "$RUNNER_TEMP/source-commit-build.application.json"
          curl -fsSL -H "Authorization: Bearer $TOKEN" \
            "$BASE/api/v1/applications" -o "$RUNNER_TEMP/source-commit-build.applications.json"
          python3 - <<'PY'
          import json
          import os
          import sys

          target = os.environ.get("APP", "")

          def unwrap(payload):
              if isinstance(payload, dict) and isinstance(payload.get("data"), (dict, list)):
                  return payload["data"]
              return payload

          def setting_value(row):
              if not isinstance(row, dict):
                  return None
              direct = row.get("include_source_commit_in_build")
              if isinstance(direct, bool):
                  return direct
              settings = row.get("settings")
              if isinstance(settings, dict) and isinstance(settings.get("include_source_commit_in_build"), bool):
                  return settings["include_source_commit_in_build"]
              return None

          direct_payload = unwrap(json.load(open(
              os.path.join(os.environ["RUNNER_TEMP"], "source-commit-build.application.json"),
              encoding="utf-8",
          )))
          list_payload = unwrap(json.load(open(
              os.path.join(os.environ["RUNNER_TEMP"], "source-commit-build.applications.json"),
              encoding="utf-8",
          )))
          candidates = [direct_payload]
          if isinstance(list_payload, list):
              candidates.extend(
                  row for row in list_payload
                  if isinstance(row, dict) and row.get("uuid") == target
              )
          observed = [setting_value(row) for row in candidates]
          if any(value is True for value in observed):
              print("source_commit_build_setting=ENABLED")
              raise SystemExit(0)
          print("source_commit_build_setting=UNKNOWN")
          raise SystemExit(1)
          PY

      # This is deliberately a read-only preflight.  It does not create an
      # Access service token, modify a policy, call the private probe, or
      # publish a result.  Each API body stays in the ephemeral runner and the
      # public Actions log receives only a finite capability classification.
      - name: 只读核对每日资金 Cloudflare Access 能力（无服务令牌或策略写入）
        if: inputs.mode == 'daily-funds-access-audit'
        env:
          CF_ACCOUNT_ID: ${{ secrets.DAILY_FUNDS_CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.DAILY_FUNDS_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF:-}" = "refs/heads/main" || { echo "daily_funds_access_audit=MAIN_REF_REQUIRED"; exit 1; }
          test -n "${CF_ACCOUNT_ID:-}" || { echo "daily_funds_access_audit=CONFIG_UNAVAILABLE"; exit 1; }
          test -n "${CF_API_TOKEN:-}" || { echo "daily_funds_access_audit=CONFIG_UNAVAILABLE"; exit 1; }
          echo "::add-mask::$CF_ACCOUNT_ID"
          echo "::add-mask::$CF_API_TOKEN"
          cleanup() {
            rm -f "$RUNNER_TEMP/cf-access-index.tsv" \
              "$RUNNER_TEMP"/cf-access-*.json
          }
          trap cleanup EXIT
          : > "$RUNNER_TEMP/cf-access-index.tsv"
          request() {
            local check="$1"
            local url="$2"
            local response="$RUNNER_TEMP/cf-access-${check}.json"
            local status curl_exit
            set +e
            status="$(curl -sS --request GET --connect-timeout 10 --max-time 30 \
              -o "$response" -w '%{http_code}' \
              -H "Authorization: Bearer $CF_API_TOKEN" "$url" 2>/dev/null)"
            curl_exit=$?
            set -e
            printf '%s\t%s\t%s\t%s\n' "$check" "$status" "$curl_exit" "$response" \
              >> "$RUNNER_TEMP/cf-access-index.tsv"
          }
          request token_verify "https://api.cloudflare.com/client/v4/user/tokens/verify"
          request apps_read "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/access/apps"
          request service_tokens_read "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/access/service_tokens"
          request policies_read "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/access/policies"
          mapfile -t responses < "$RUNNER_TEMP/cf-access-index.tsv"
          test "${#responses[@]}" -eq 4 || { echo "daily_funds_access_audit=INPUT_UNAVAILABLE"; exit 1; }
          args=()
          for row in "${responses[@]}"; do
            IFS=$'\t' read -r check status curl_exit response <<< "$row"
            args+=(--response "$check" "$status" "$curl_exit" "$response")
          done
          python3 "KMFA/skills/每日资金/scripts/summarize_cloudflare_access_audit.py" "${args[@]}"

      # Owner 2026-08-10 明确要求 KMFA 网站不需要登录。只匹配当前驾驶舱
      # 实际使用的 KMFA 域名与路径；根域泛化、其他域名和未知 Access 应用一律
      # 不碰。Cloudflare Bypass 需要与源站 JWT 守卫一起关闭，否则边缘公开后
      # 源站仍会 403，页面照样不可用。
      - name: 应用 Owner 批准的 KMFA 无登录公开面（精确 Access 覆盖）
        if: inputs.mode == 'public-dashboard'
        env:
          CF_ACCOUNT_ID: ${{ secrets.DAILY_FUNDS_CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.DAILY_FUNDS_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF:-}" = "refs/heads/main" || { echo "public_dashboard=MAIN_REF_REQUIRED"; exit 1; }
          test -n "${APP:-}" || { echo "public_dashboard=APP_REQUIRED"; exit 1; }
          test -n "${BASE:-}" || { echo "public_dashboard=CONFIG_UNAVAILABLE"; exit 1; }
          test -n "${TOKEN:-}" || { echo "public_dashboard=CONFIG_UNAVAILABLE"; exit 1; }
          test -n "${CF_ACCOUNT_ID:-}" || { echo "public_dashboard=CONFIG_UNAVAILABLE"; exit 1; }
          test -n "${CF_API_TOKEN:-}" || { echo "public_dashboard=CONFIG_UNAVAILABLE"; exit 1; }
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$CF_ACCOUNT_ID"
          echo "::add-mask::$CF_API_TOKEN"
          public_dir="$(mktemp -d "$RUNNER_TEMP/kmfa-public-dashboard.XXXXXX")"
          chmod 700 "$public_dir"
          cleanup() {
            unset CF_ACCOUNT_ID CF_API_TOKEN TOKEN
            rm -f -- "$public_dir/coolify-envs-before.json" "$public_dir/origin-guard-ids.txt" \
              "$public_dir/origin-guard.json" "$public_dir/coolify-envs-after.json" \
              "$public_dir/access-apps.json" "$public_dir/access-app-ids.txt" \
              "$public_dir/policy-payload.json" "$public_dir/policies-before.json" \
              "$public_dir/policies-after.json" "$public_dir/delete-env.json" \
              "$public_dir/post-env.json" "$public_dir/policy-post.json" "$public_dir/deploy.json"
            rmdir "$public_dir" 2>/dev/null || true
          }
          trap cleanup EXIT
          request_coolify() {
            local method="$1" url="$2" output="$3" payload="${4:-}"
            if [ -n "$payload" ]; then
              REQUEST_STATUS="$(curl -sS --request "$method" --connect-timeout 5 --max-time 30 \
                -o "$output" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" \
                -H 'Content-Type: application/json' --data @"$payload" "$url" 2>/dev/null)"
            else
              REQUEST_STATUS="$(curl -sS --request "$method" --connect-timeout 5 --max-time 30 \
                -o "$output" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$url" 2>/dev/null)"
            fi
          }
          request_cf() {
            local method="$1" url="$2" output="$3" payload="${4:-}"
            if [ -n "$payload" ]; then
              REQUEST_STATUS="$(curl -sS --request "$method" --connect-timeout 5 --max-time 30 \
                -o "$output" -w '%{http_code}' -H "Authorization: Bearer $CF_API_TOKEN" \
                -H 'Content-Type: application/json' --data @"$payload" "$url" 2>/dev/null)"
            else
              REQUEST_STATUS="$(curl -sS --request "$method" --connect-timeout 5 --max-time 30 \
                -o "$output" -w '%{http_code}' -H "Authorization: Bearer $CF_API_TOKEN" "$url" 2>/dev/null)"
            fi
          }
          request_cf GET "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/access/apps?per_page=1000" "$public_dir/access-apps.json"
          test "$REQUEST_STATUS" = "200" || { echo "public_dashboard=ACCESS_APP_NOT_READABLE"; exit 1; }
          PYTHONPATH="KMFA/skills/每日资金" python3 -m daily_funds.public_dashboard_access \
            select-apps "$public_dir/access-apps.json" "$public_dir/access-app-ids.txt" \
            || { echo "public_dashboard=ACCESS_TARGET_NOT_RESOLVED"; exit 1; }
          PYTHONPATH="KMFA/skills/每日资金" python3 -m daily_funds.public_dashboard_access \
            policy-payload "$public_dir/policy-payload.json" \
            || { echo "public_dashboard=ACCESS_POLICY_PAYLOAD_INVALID"; exit 1; }
          app_count=0
          while IFS= read -r access_app_id; do
            [ -n "$access_app_id" ] || continue
            app_count=$((app_count + 1))
            echo "::add-mask::$access_app_id"
            request_cf GET "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/access/apps/${access_app_id}/policies?per_page=1000" "$public_dir/policies-before.json"
            test "$REQUEST_STATUS" = "200" || { echo "public_dashboard=ACCESS_POLICY_NOT_READABLE"; exit 1; }
            policy_state="$(PYTHONPATH="KMFA/skills/每日资金" python3 -m daily_funds.public_dashboard_access policy-state "$public_dir/policies-before.json")" \
              || { echo "public_dashboard=ACCESS_POLICY_INVALID"; exit 1; }
            case "$policy_state" in
              MISSING)
                request_cf POST "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/access/apps/${access_app_id}/policies" "$public_dir/policy-post.json" "$public_dir/policy-payload.json"
                test "$REQUEST_STATUS" = "200" || test "$REQUEST_STATUS" = "201" || { echo "public_dashboard=ACCESS_POLICY_WRITE_FAILED"; exit 1; }
                rm -f -- "$public_dir/policy-post.json"
                ;;
              PRESENT) ;;
              *) echo "public_dashboard=ACCESS_POLICY_INVALID"; exit 1 ;;
            esac
            request_cf GET "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/access/apps/${access_app_id}/policies?per_page=1000" "$public_dir/policies-after.json"
            test "$REQUEST_STATUS" = "200" || { echo "public_dashboard=ACCESS_POLICY_POSTREAD_FAILED"; exit 1; }
            test "$(PYTHONPATH="KMFA/skills/每日资金" python3 -m daily_funds.public_dashboard_access policy-state "$public_dir/policies-after.json")" = "PRESENT" \
              || { echo "public_dashboard=ACCESS_POLICY_POSTREAD_INVALID"; exit 1; }
          done < "$public_dir/access-app-ids.txt"
          test "$app_count" -gt 0 || { echo "public_dashboard=ACCESS_TARGET_NOT_RESOLVED"; exit 1; }
          # Do the source-side change only after each exact Access application
          # is confirmed Bypass.  A later Coolify failure therefore preserves
          # the existing source guard instead of exposing an unverified edge.
          request_coolify GET "$BASE/api/v1/applications/$APP/envs" "$public_dir/coolify-envs-before.json"
          test "$REQUEST_STATUS" = "200" || { echo "public_dashboard=COOLIFY_ENV_NOT_READABLE"; exit 1; }
          PYTHONPATH="KMFA/skills/每日资金" python3 -m daily_funds.public_dashboard_access \
            origin-guard-entry-ids "$public_dir/coolify-envs-before.json" "$public_dir/origin-guard-ids.txt" \
            || { echo "public_dashboard=ORIGIN_GUARD_TARGET_INVALID"; exit 1; }
          while IFS= read -r environment_id; do
            [ -n "$environment_id" ] || continue
            request_coolify DELETE "$BASE/api/v1/applications/$APP/envs/$environment_id" "$public_dir/delete-env.json"
            test "$REQUEST_STATUS" = "200" || test "$REQUEST_STATUS" = "204" || { echo "public_dashboard=ORIGIN_GUARD_DELETE_FAILED"; exit 1; }
            rm -f -- "$public_dir/delete-env.json"
          done < "$public_dir/origin-guard-ids.txt"
          python3 - <<'PY' > "$public_dir/origin-guard.json"
          import json
          print(json.dumps({"key": "KMFA_PRIVATE_OPS_REQUIRE_ACCESS", "value": "0"}))
          PY
          request_coolify POST "$BASE/api/v1/applications/$APP/envs" "$public_dir/post-env.json" "$public_dir/origin-guard.json"
          test "$REQUEST_STATUS" = "200" || test "$REQUEST_STATUS" = "201" || { echo "public_dashboard=ORIGIN_GUARD_WRITE_FAILED"; exit 1; }
          rm -f -- "$public_dir/post-env.json"
          request_coolify GET "$BASE/api/v1/applications/$APP/envs" "$public_dir/coolify-envs-after.json"
          test "$REQUEST_STATUS" = "200" || { echo "public_dashboard=ORIGIN_GUARD_POSTREAD_FAILED"; exit 1; }
          test "$(PYTHONPATH="KMFA/skills/每日资金" python3 -m daily_funds.public_dashboard_access origin-guard-state "$public_dir/coolify-envs-after.json")" = "PRESENT" \
            || { echo "public_dashboard=ORIGIN_GUARD_POSTREAD_INVALID"; exit 1; }
          request_coolify POST "$BASE/api/v1/deploy?uuid=$APP" "$public_dir/deploy.json"
          test "$REQUEST_STATUS" = "200" || test "$REQUEST_STATUS" = "201" || test "$REQUEST_STATUS" = "202" \
            || { echo "public_dashboard=REDEPLOY_NOT_TRIGGERED"; exit 1; }
          echo "public_dashboard=APPLIED"
          echo "public_dashboard_access_applications=$app_count"
          echo "public_dashboard_origin_guard=DISABLED"
          echo "public_dashboard_redeploy=TRIGGERED"

      # This is the sole mutating Access operation for the fixed DWS history
      # probe.  It never accepts a command or source argument: first resolve
      # exactly one narrow /ops Access app, then create a 60-minute service
      # token + app-specific Service Auth policy, call the fixed no-body
      # endpoint, and delete only those two resources in the EXIT trap.
      - name: 受控触发每日资金固定历史探针（短时 Access 身份自动撤销）
        if: inputs.mode == 'daily-funds-history-probe-bridge'
        env:
          CF_ACCOUNT_ID: ${{ secrets.DAILY_FUNDS_CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.DAILY_FUNDS_CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF:-}" = "refs/heads/main" || { echo "daily_funds_history_probe_bridge=MAIN_REF_REQUIRED"; exit 1; }
          test -n "${APP:-}" || { echo "daily_funds_history_probe_bridge=APP_REQUIRED"; exit 1; }
          test -n "${BASE:-}" || { echo "daily_funds_history_probe_bridge=CONFIG_UNAVAILABLE"; exit 1; }
          test -n "${TOKEN:-}" || { echo "daily_funds_history_probe_bridge=CONFIG_UNAVAILABLE"; exit 1; }
          test -n "${CF_ACCOUNT_ID:-}" || { echo "daily_funds_history_probe_bridge=CONFIG_UNAVAILABLE"; exit 1; }
          test -n "${CF_API_TOKEN:-}" || { echo "daily_funds_history_probe_bridge=CONFIG_UNAVAILABLE"; exit 1; }
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$CF_ACCOUNT_ID"
          echo "::add-mask::$CF_API_TOKEN"
          bridge_dir="$(mktemp -d "$RUNNER_TEMP/daily-funds-access-bridge.XXXXXX")"
          chmod 700 "$bridge_dir"
          service_create_attempted=0
          service_created=0
          policy_create_attempted=0
          policy_created=0
          cleanup_result=OK

          request_cf() {
            local method="$1"
            local url="$2"
            local output="$3"
            local payload="${4:-}"
            if [ -n "$payload" ]; then
              if REQUEST_STATUS="$(curl -sS --request "$method" --connect-timeout 3 --max-time 12 \
                -o "$output" -w '%{http_code}' -H "Authorization: Bearer $CF_API_TOKEN" \
                -H "Content-Type: application/json" --data @"$payload" "$url" 2>/dev/null)"; then
                REQUEST_EXIT=0
              else
                REQUEST_EXIT=$?
              fi
            elif REQUEST_STATUS="$(curl -sS --request "$method" --connect-timeout 3 --max-time 12 \
              -o "$output" -w '%{http_code}' -H "Authorization: Bearer $CF_API_TOKEN" "$url" 2>/dev/null)"; then
              REQUEST_EXIT=0
            else
              REQUEST_EXIT=$?
            fi
          }

          request_coolify() {
            local url="$1"
            local output="$2"
            if REQUEST_STATUS="$(curl -sS --request GET --connect-timeout 3 --max-time 12 \
              -o "$output" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$url" 2>/dev/null)"; then
              REQUEST_EXIT=0
            else
              REQUEST_EXIT=$?
            fi
          }

          request_probe() {
            local method="$1"
            local output="$2"
            if REQUEST_STATUS="$(curl -sS --request "$method" --connect-timeout 2 --max-time 3 \
              -D "$output.headers" -o "$output" -w '%{http_code}' \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" \
              -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              -H "Origin: $PROBE_ORIGIN" "$PROBE_ORIGIN/ops/api/daily-funds/history-probe" 2>/dev/null)"; then
              REQUEST_EXIT=0
            else
              REQUEST_EXIT=$?
            fi
          }

          reconcile_owned_resources() {
            # Direct DELETE replies alone are not a cleanup oracle: a response
            # may be empty, delayed or malformed.  Re-read only the exact
            # run-scoped name, delete any remaining policy before its token,
            # then require a final absent read.  No opaque ID ever reaches log.
            request_cf GET "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/access/service_tokens?per_page=1000" "$bridge_dir/service-token-list-before.json"
            if [ "$REQUEST_EXIT" -ne 0 ] || [ "$REQUEST_STATUS" != "200" ]; then return 1; fi
            request_cf GET "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/access/apps/${CF_ACCESS_APP_ID}/policies?per_page=1000" "$bridge_dir/policy-list-before.json"
            if [ "$REQUEST_EXIT" -ne 0 ] || [ "$REQUEST_STATUS" != "200" ]; then return 1; fi
            if ! python3 "KMFA/skills/每日资金/scripts/manage_cloudflare_access_bridge.py" write-owned-resource-env \
              --service-tokens "$bridge_dir/service-token-list-before.json" \
              --policies "$bridge_dir/policy-list-before.json" --run-tag "$run_tag" \
              --output "$bridge_dir/owned-resources.env"; then return 1; fi
            unset CF_ACCESS_OWNED_POLICY_IDS CF_ACCESS_OWNED_SERVICE_TOKEN_IDS
            . "$bridge_dir/owned-resources.env"
            for owned_policy_id in $CF_ACCESS_OWNED_POLICY_IDS; do
              request_cf DELETE "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/access/apps/${CF_ACCESS_APP_ID}/policies/${owned_policy_id}" "$bridge_dir/policy-reconcile-delete.json"
              if [ "$REQUEST_EXIT" -ne 0 ] || [ "$REQUEST_STATUS" != "200" ] || ! python3 "KMFA/skills/每日资金/scripts/manage_cloudflare_access_bridge.py" validate-success --response "$bridge_dir/policy-reconcile-delete.json" >/dev/null 2>&1; then return 1; fi
            done
            for owned_service_token_id in $CF_ACCESS_OWNED_SERVICE_TOKEN_IDS; do
              request_cf DELETE "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/access/service_tokens/${owned_service_token_id}" "$bridge_dir/service-token-reconcile-delete.json"
              if [ "$REQUEST_EXIT" -ne 0 ] || [ "$REQUEST_STATUS" != "200" ] || ! python3 "KMFA/skills/每日资金/scripts/manage_cloudflare_access_bridge.py" validate-success --response "$bridge_dir/service-token-reconcile-delete.json" >/dev/null 2>&1; then return 1; fi
            done
            unset CF_ACCESS_OWNED_POLICY_IDS CF_ACCESS_OWNED_SERVICE_TOKEN_IDS
            request_cf GET "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/access/service_tokens?per_page=1000" "$bridge_dir/service-token-list-after.json"
            if [ "$REQUEST_EXIT" -ne 0 ] || [ "$REQUEST_STATUS" != "200" ]; then return 1; fi
            request_cf GET "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/access/apps/${CF_ACCESS_APP_ID}/policies?per_page=1000" "$bridge_dir/policy-list-after.json"
            if [ "$REQUEST_EXIT" -ne 0 ] || [ "$REQUEST_STATUS" != "200" ]; then return 1; fi
            final_state="$(python3 "KMFA/skills/每日资金/scripts/manage_cloudflare_access_bridge.py" owned-resource-state \
              --service-tokens "$bridge_dir/service-token-list-after.json" \
              --policies "$bridge_dir/policy-list-after.json" --run-tag "$run_tag")"
            test "$final_state" = "ABSENT"
          }

          cleanup() {
            set +e
            if [ "$policy_created" = "1" ] && [ -f "$bridge_dir/policy.env" ]; then
              unset CF_ACCESS_POLICY_ID
              . "$bridge_dir/policy.env"
              request_cf DELETE "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/access/apps/${CF_ACCESS_APP_ID}/policies/${CF_ACCESS_POLICY_ID}" "$bridge_dir/policy-delete.json"
              unset CF_ACCESS_POLICY_ID
            fi
            if [ "$service_created" = "1" ] && [ -f "$bridge_dir/service-token-id.env" ]; then
              unset CF_ACCESS_SERVICE_TOKEN_ID
              . "$bridge_dir/service-token-id.env"
              request_cf DELETE "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/access/service_tokens/${CF_ACCESS_SERVICE_TOKEN_ID}" "$bridge_dir/service-token-delete.json"
              unset CF_ACCESS_SERVICE_TOKEN_ID
            fi
            if [ "$policy_create_attempted" = "1" ] || [ "$service_create_attempted" = "1" ]; then
              if [ -z "${CF_ACCESS_APP_ID:-}" ] || ! reconcile_owned_resources; then
                cleanup_result=NEEDS_ATTENTION
              fi
            fi
            unset CF_ACCESS_CLIENT_ID CF_ACCESS_CLIENT_SECRET CF_ACCESS_SERVICE_TOKEN_ID
            unset CF_ACCESS_POLICY_ID CF_ACCESS_APP_ID PROBE_ORIGIN
            rm -f -- "$bridge_dir/coolify-envs.json" "$bridge_dir/access-apps.json" \
              "$bridge_dir/target.env" "$bridge_dir/service-token-payload.json" \
              "$bridge_dir/service-token-response.json" "$bridge_dir/service-token-id.env" \
              "$bridge_dir/service-token.env" "$bridge_dir/policy-payload.json" \
              "$bridge_dir/policy-response.json" "$bridge_dir/policy.env" \
              "$bridge_dir/probe-post.json" "$bridge_dir/probe-post.json.headers" "$bridge_dir/probe-start-receipt.json" \
              "$bridge_dir/probe-get.json" "$bridge_dir/probe-get.json.headers" \
              "$bridge_dir/probe-receipt.json" "$bridge_dir/policy-delete.json" \
              "$bridge_dir/service-token-delete.json" "$bridge_dir/service-token-list-before.json" \
              "$bridge_dir/policy-list-before.json" "$bridge_dir/owned-resources.env" \
              "$bridge_dir/policy-reconcile-delete.json" "$bridge_dir/service-token-reconcile-delete.json" \
              "$bridge_dir/service-token-list-after.json" "$bridge_dir/policy-list-after.json"
            if ! rmdir "$bridge_dir" 2>/dev/null; then
              cleanup_result=NEEDS_ATTENTION
            fi
            echo "daily_funds_history_probe_bridge_cleanup=$cleanup_result"
            if [ "$cleanup_result" != "OK" ]; then
              trap - EXIT
              exit 1
            fi
          }
          trap cleanup EXIT

          request_coolify "$BASE/api/v1/applications/$APP/envs" "$bridge_dir/coolify-envs.json"
          if [ "$REQUEST_EXIT" -ne 0 ] || [ "$REQUEST_STATUS" != "200" ]; then
            echo "daily_funds_history_probe_bridge=COOLIFY_ENV_NOT_READABLE"
            exit 1
          fi
          request_cf GET "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/access/apps?per_page=1000" "$bridge_dir/access-apps.json"
          if [ "$REQUEST_EXIT" -ne 0 ] || [ "$REQUEST_STATUS" != "200" ]; then
            echo "daily_funds_history_probe_bridge=ACCESS_APP_NOT_READABLE"
            exit 1
          fi
          if ! python3 "KMFA/skills/每日资金/scripts/manage_cloudflare_access_bridge.py" resolve-target \
            --coolify-env "$bridge_dir/coolify-envs.json" --access-apps "$bridge_dir/access-apps.json" \
            --output "$bridge_dir/target.env"; then
            echo "daily_funds_history_probe_bridge=ACCESS_TARGET_NOT_RESOLVED"
            exit 1
          fi
          . "$bridge_dir/target.env"
          echo "::add-mask::$CF_ACCESS_APP_ID"
          echo "::add-mask::$PROBE_ORIGIN"

          run_tag="${GITHUB_RUN_ID:-0}-${GITHUB_RUN_ATTEMPT:-0}"
          python3 "KMFA/skills/每日资金/scripts/manage_cloudflare_access_bridge.py" write-service-token-payload \
            --run-tag "$run_tag" --output "$bridge_dir/service-token-payload.json"
          request_cf POST "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/access/service_tokens" "$bridge_dir/service-token-response.json" "$bridge_dir/service-token-payload.json"
          if [ "$REQUEST_EXIT" -ne 0 ] || { [ "$REQUEST_STATUS" != "200" ] && [ "$REQUEST_STATUS" != "201" ]; }; then
            echo "daily_funds_history_probe_bridge=SERVICE_TOKEN_NOT_CREATED"
            exit 1
          fi
          service_create_attempted=1
          if ! python3 "KMFA/skills/每日资金/scripts/manage_cloudflare_access_bridge.py" capture-service-token-id \
            --response "$bridge_dir/service-token-response.json" --output "$bridge_dir/service-token-id.env"; then
            echo "daily_funds_history_probe_bridge=SERVICE_TOKEN_CLEANUP_UNTRACKED"
            exit 1
          fi
          . "$bridge_dir/service-token-id.env"
          echo "::add-mask::$CF_ACCESS_SERVICE_TOKEN_ID"
          service_created=1
          if ! python3 "KMFA/skills/每日资金/scripts/manage_cloudflare_access_bridge.py" capture-service-token \
            --response "$bridge_dir/service-token-response.json" --output "$bridge_dir/service-token.env"; then
            echo "daily_funds_history_probe_bridge=SERVICE_TOKEN_MATERIAL_INVALID"
            exit 1
          fi
          . "$bridge_dir/service-token.env"
          echo "::add-mask::$CF_ACCESS_CLIENT_ID"
          echo "::add-mask::$CF_ACCESS_CLIENT_SECRET"

          python3 "KMFA/skills/每日资金/scripts/manage_cloudflare_access_bridge.py" write-policy-payload \
            --service-material "$bridge_dir/service-token.env" --run-tag "$run_tag" \
            --output "$bridge_dir/policy-payload.json"
          request_cf POST "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/access/apps/${CF_ACCESS_APP_ID}/policies" "$bridge_dir/policy-response.json" "$bridge_dir/policy-payload.json"
          if [ "$REQUEST_EXIT" -ne 0 ] || { [ "$REQUEST_STATUS" != "200" ] && [ "$REQUEST_STATUS" != "201" ]; }; then
            echo "daily_funds_history_probe_bridge=SERVICE_AUTH_POLICY_NOT_CREATED"
            exit 1
          fi
          policy_create_attempted=1
          if ! python3 "KMFA/skills/每日资金/scripts/manage_cloudflare_access_bridge.py" capture-policy \
            --response "$bridge_dir/policy-response.json" --output "$bridge_dir/policy.env"; then
            echo "daily_funds_history_probe_bridge=SERVICE_AUTH_POLICY_CLEANUP_UNTRACKED"
            exit 1
          fi
          . "$bridge_dir/policy.env"
          echo "::add-mask::$CF_ACCESS_POLICY_ID"
          policy_created=1

          # A newly-created Service Auth policy is evaluated at the Access
          # edge.  Give that fixed, short window to settle before the only
          # allowed POST; this is not an unbounded retry and accepts no input.
          sleep 10
          request_probe POST "$bridge_dir/probe-post.json"
          python3 "KMFA/skills/每日资金/scripts/manage_cloudflare_access_bridge.py" summarize-probe-start \
            --response "$bridge_dir/probe-post.json" --headers "$bridge_dir/probe-post.json.headers" --http-status "$REQUEST_STATUS" \
            --curl-exit "$REQUEST_EXIT" --output "$bridge_dir/probe-start-receipt.json"
          start_poll_state="$(python3 "KMFA/skills/每日资金/scripts/manage_cloudflare_access_bridge.py" probe-start-poll-state \
            --receipt "$bridge_dir/probe-start-receipt.json")"
          if [ "$start_poll_state" != "POLL" ]; then
            python3 "KMFA/skills/每日资金/scripts/manage_cloudflare_access_bridge.py" summarize-probe-start \
              --response "$bridge_dir/probe-post.json" --headers "$bridge_dir/probe-post.json.headers" --http-status "$REQUEST_STATUS" --curl-exit "$REQUEST_EXIT"
            echo "daily_funds_history_probe_bridge=HISTORY_PROBE_REQUEST_NOT_ACCEPTED"
            exit 1
          fi

          probe_outcome=NOT_MET
          for attempt in $(seq 1 15); do
            request_probe GET "$bridge_dir/probe-get.json"
            python3 "KMFA/skills/每日资金/scripts/manage_cloudflare_access_bridge.py" summarize-probe \
              --response "$bridge_dir/probe-get.json" --headers "$bridge_dir/probe-get.json.headers" --http-status "$REQUEST_STATUS" \
              --curl-exit "$REQUEST_EXIT" --output "$bridge_dir/probe-receipt.json"
            poll_state="$(python3 "KMFA/skills/每日资金/scripts/manage_cloudflare_access_bridge.py" probe-poll-state --receipt "$bridge_dir/probe-receipt.json")"
            case "$poll_state" in
              COMPLETED)
                probe_outcome=HISTORY_PROBE_COMPLETED
                break
                ;;
              PENDING)
                if [ "$attempt" -lt 15 ]; then sleep 5; fi
                ;;
              *)
                break
                ;;
            esac
          done
          python3 "KMFA/skills/每日资金/scripts/manage_cloudflare_access_bridge.py" summarize-probe \
            --response "$bridge_dir/probe-get.json" --headers "$bridge_dir/probe-get.json.headers" --http-status "$REQUEST_STATUS" --curl-exit "$REQUEST_EXIT"
          echo "daily_funds_history_probe_bridge=$probe_outcome"
          test "$probe_outcome" = "HISTORY_PROBE_COMPLETED"

      # A failed bridge must not leave a 60-minute service credential behind.
      # This recovery mode accepts no source, URL, ID or arbitrary command:
      # it deletes only the exact name derived from a validated prior Actions
      # run tag, then proves the corresponding lists are empty.
      - name: 清理指定每日资金历史探针的短时 Access 身份
        if: inputs.mode == 'daily-funds-history-probe-cleanup'
        env:
          CF_ACCOUNT_ID: ${{ secrets.DAILY_FUNDS_CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.DAILY_FUNDS_CLOUDFLARE_API_TOKEN }}
          BRIDGE_RUN_TAG: ${{ inputs.bridge_run_tag }}
        run: |
          set -euo pipefail
          test "${GITHUB_REF:-}" = "refs/heads/main" || { echo "daily_funds_history_probe_cleanup=MAIN_REF_REQUIRED"; exit 1; }
          test -n "${APP:-}" || { echo "daily_funds_history_probe_cleanup=APP_REQUIRED"; exit 1; }
          test -n "${CF_ACCOUNT_ID:-}" || { echo "daily_funds_history_probe_cleanup=CONFIG_UNAVAILABLE"; exit 1; }
          test -n "${CF_API_TOKEN:-}" || { echo "daily_funds_history_probe_cleanup=CONFIG_UNAVAILABLE"; exit 1; }
          [[ "${BRIDGE_RUN_TAG:-}" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$ ]] || { echo "daily_funds_history_probe_cleanup=RUN_TAG_INVALID"; exit 1; }
          echo "::add-mask::$CF_ACCOUNT_ID"
          echo "::add-mask::$CF_API_TOKEN"
          bridge_dir="$(mktemp -d "$RUNNER_TEMP/daily-funds-access-cleanup.XXXXXX")"
          chmod 700 "$bridge_dir"
          cleanup() {
            rm -f -- "$bridge_dir/coolify-envs.json" "$bridge_dir/access-apps.json" \
              "$bridge_dir/target.env" "$bridge_dir/service-token-list-before.json" \
              "$bridge_dir/policy-list-before.json" "$bridge_dir/owned-resources.env" \
              "$bridge_dir/policy-delete.json" "$bridge_dir/service-token-delete.json" \
              "$bridge_dir/service-token-list-after.json" "$bridge_dir/policy-list-after.json"
            rmdir "$bridge_dir" 2>/dev/null || true
          }
          trap cleanup EXIT

          request_cf() {
            local method="$1"
            local url="$2"
            local output="$3"
            if REQUEST_STATUS="$(curl -sS --request "$method" --connect-timeout 3 --max-time 12 \
              -o "$output" -w '%{http_code}' -H "Authorization: Bearer $CF_API_TOKEN" "$url" 2>/dev/null)"; then
              REQUEST_EXIT=0
            else
              REQUEST_EXIT=$?
            fi
          }
          request_coolify() {
            local url="$1"
            local output="$2"
            if REQUEST_STATUS="$(curl -sS --request GET --connect-timeout 3 --max-time 12 \
              -o "$output" -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$url" 2>/dev/null)"; then
              REQUEST_EXIT=0
            else
              REQUEST_EXIT=$?
            fi
          }

          request_coolify "$BASE/api/v1/applications/$APP/envs" "$bridge_dir/coolify-envs.json"
          if [ "$REQUEST_EXIT" -ne 0 ] || [ "$REQUEST_STATUS" != "200" ]; then
            echo "daily_funds_history_probe_cleanup=COOLIFY_ENV_NOT_READABLE"; exit 1
          fi
          request_cf GET "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/access/apps?per_page=1000" "$bridge_dir/access-apps.json"
          if [ "$REQUEST_EXIT" -ne 0 ] || [ "$REQUEST_STATUS" != "200" ]; then
            echo "daily_funds_history_probe_cleanup=ACCESS_APP_NOT_READABLE"; exit 1
          fi
          if ! python3 "KMFA/skills/每日资金/scripts/manage_cloudflare_access_bridge.py" resolve-target \
            --coolify-env "$bridge_dir/coolify-envs.json" --access-apps "$bridge_dir/access-apps.json" \
            --output "$bridge_dir/target.env"; then
            echo "daily_funds_history_probe_cleanup=ACCESS_TARGET_NOT_RESOLVED"; exit 1
          fi
          . "$bridge_dir/target.env"
          echo "::add-mask::$CF_ACCESS_APP_ID"

          request_cf GET "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/access/service_tokens?per_page=1000" "$bridge_dir/service-token-list-before.json"
          if [ "$REQUEST_EXIT" -ne 0 ] || [ "$REQUEST_STATUS" != "200" ]; then
            echo "daily_funds_history_probe_cleanup=SERVICE_TOKEN_LIST_NOT_READABLE"; exit 1
          fi
          request_cf GET "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/access/apps/${CF_ACCESS_APP_ID}/policies?per_page=1000" "$bridge_dir/policy-list-before.json"
          if [ "$REQUEST_EXIT" -ne 0 ] || [ "$REQUEST_STATUS" != "200" ]; then
            echo "daily_funds_history_probe_cleanup=POLICY_LIST_NOT_READABLE"; exit 1
          fi
          python3 "KMFA/skills/每日资金/scripts/manage_cloudflare_access_bridge.py" write-owned-resource-env \
            --service-tokens "$bridge_dir/service-token-list-before.json" \
            --policies "$bridge_dir/policy-list-before.json" --run-tag "$BRIDGE_RUN_TAG" \
            --output "$bridge_dir/owned-resources.env"
          unset CF_ACCESS_OWNED_POLICY_IDS CF_ACCESS_OWNED_SERVICE_TOKEN_IDS
          . "$bridge_dir/owned-resources.env"
          for owned_policy_id in $CF_ACCESS_OWNED_POLICY_IDS; do
            request_cf DELETE "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/access/apps/${CF_ACCESS_APP_ID}/policies/${owned_policy_id}" "$bridge_dir/policy-delete.json"
            if [ "$REQUEST_EXIT" -ne 0 ] || [ "$REQUEST_STATUS" != "200" ] || ! python3 "KMFA/skills/每日资金/scripts/manage_cloudflare_access_bridge.py" validate-success --response "$bridge_dir/policy-delete.json" >/dev/null 2>&1; then
              echo "daily_funds_history_probe_cleanup=POLICY_DELETE_UNCONFIRMED"; exit 1
            fi
          done
          for owned_service_token_id in $CF_ACCESS_OWNED_SERVICE_TOKEN_IDS; do
            request_cf DELETE "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/access/service_tokens/${owned_service_token_id}" "$bridge_dir/service-token-delete.json"
            if [ "$REQUEST_EXIT" -ne 0 ] || [ "$REQUEST_STATUS" != "200" ] || ! python3 "KMFA/skills/每日资金/scripts/manage_cloudflare_access_bridge.py" validate-success --response "$bridge_dir/service-token-delete.json" >/dev/null 2>&1; then
              echo "daily_funds_history_probe_cleanup=SERVICE_TOKEN_DELETE_UNCONFIRMED"; exit 1
            fi
          done
          unset CF_ACCESS_OWNED_POLICY_IDS CF_ACCESS_OWNED_SERVICE_TOKEN_IDS
          request_cf GET "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/access/service_tokens?per_page=1000" "$bridge_dir/service-token-list-after.json"
          if [ "$REQUEST_EXIT" -ne 0 ] || [ "$REQUEST_STATUS" != "200" ]; then
            echo "daily_funds_history_probe_cleanup=SERVICE_TOKEN_POSTREAD_UNAVAILABLE"; exit 1
          fi
          request_cf GET "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/access/apps/${CF_ACCESS_APP_ID}/policies?per_page=1000" "$bridge_dir/policy-list-after.json"
          if [ "$REQUEST_EXIT" -ne 0 ] || [ "$REQUEST_STATUS" != "200" ]; then
            echo "daily_funds_history_probe_cleanup=POLICY_POSTREAD_UNAVAILABLE"; exit 1
          fi
          final_state="$(python3 "KMFA/skills/每日资金/scripts/manage_cloudflare_access_bridge.py" owned-resource-state \
            --service-tokens "$bridge_dir/service-token-list-after.json" \
            --policies "$bridge_dir/policy-list-after.json" --run-tag "$BRIDGE_RUN_TAG")"
          echo "daily_funds_history_probe_cleanup=$final_state"
          test "$final_state" = "ABSENT"

      - name: 就地生成备份密钥并注入 Coolify（私钥不落人手）
        if: inputs.mode == 'provision-backup-key'
        run: |
          set -euo pipefail
          test -n "${APP:-}" || { echo "需要 app_uuid（先跑 list）"; exit 1; }
          ssh-keygen -t ed25519 -N "" -C "kmfa-vps-daily-backup@private-database" -f "$RUNNER_TEMP/k" -q
          # 立刻 mask 私钥的 base64 单行，杜绝任何后续步骤误打印
          B64="$(base64 -w0 < "$RUNNER_TEMP/k")"
          echo "::add-mask::$B64"
          # 写进 Coolify：先试新增，已存在则改（值经 --data @file，不进命令行/日志）
          python3 - <<'PY' > "$RUNNER_TEMP/payload.json"
          import json, os, base64
          b64 = base64.b64encode(open(os.path.join(os.environ["RUNNER_TEMP"], "k"), "rb").read()).decode()
          # Coolify compose 资源不接受 is_build_time（实测 422），只送 key/value
          print(json.dumps({"key": "KMFA_BACKUP_SSH_KEY_B64", "value": b64}))
          PY
          code=$(curl -sS -o "$RUNNER_TEMP/post.out" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data @"$RUNNER_TEMP/payload.json" "$BASE/api/v1/applications/$APP/envs" || true)
          echo "POST env 返回码=$code"
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            code=$(curl -sS -o "$RUNNER_TEMP/patch.out" -w '%{http_code}' -X PATCH \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data @"$RUNNER_TEMP/payload.json" "$BASE/api/v1/applications/$APP/envs" || true)
            echo "PATCH env 返回码=$code"
          fi
          # 失败时回显错误原因（脱敏：抹掉任何长 base64 串，杜绝把私钥写进公开日志）
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            python3 - <<'PY'
          import os, re
          for name in ("post.out", "patch.out"):
              p = os.path.join(os.environ["RUNNER_TEMP"], name)
              if not os.path.exists(p): continue
              t = open(p, encoding="utf-8", errors="replace").read()[:800]
              t = re.sub(r"[A-Za-z0-9+/=]{40,}", "<REDACTED>", t)
              print(f"--- {name} ---"); print(t)
          PY
          fi
          rm -f "$RUNNER_TEMP/payload.json" "$RUNNER_TEMP/k"
          echo "—— 把下面这行公钥登记为 Private-Database 的可写 deploy key（公钥非秘密）——"
          cat "$RUNNER_TEMP/k.pub"

      - name: 看非秘密开关的值（诊断：技能为何不投递）
        if: inputs.mode == 'flags'
        run: |
          set -euo pipefail
          test -n "${APP:-}" || { echo "需要 app_uuid"; exit 1; }
          curl -fsSL -H "Authorization: Bearer $TOKEN" "$BASE/api/v1/applications/$APP/envs" -o "$RUNNER_TEMP/envs.json"
          python3 - <<'PY'
          import json, os, re
          d = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "envs.json"), encoding="utf-8"))
          envs = d if isinstance(d, list) else d.get("data") or []
          # 白名单：只回显「开关/模式」类非秘密键。每日资金的 group、sender、
          # account、bucket 等标识同样属于受保护运行配置，绝不进入公开 Actions
          # 日志；其他凭据型键也只显示是否有值。
          SECRET = re.compile(r"TOKEN|KEY|SECRET|PASSWORD|SIGNING|CODE|URL|AUD|DSN|^DAILY_FUNDS_", re.I)
          SAFE = re.compile(r"^KMFA_.*(ENABLED|MODE|REQUIRE|POLICY)$|^COMPOSE_PROFILES$|^TZ$", re.I)
          print("=== 开关值（诊断）===")
          for e in sorted(envs, key=lambda x: str(x.get("key"))):
              k = str(e.get("key")); v = e.get("value")
              if SAFE.match(k) and not SECRET.search(k):
                  print(f"  {k} = {v!r}")
              elif SECRET.search(k):
                  print(f"  {k} = <{'已设置' if (v not in (None, '')) else '空'}>")
          PY

      - name: 最近部署记录
        if: inputs.mode == 'deployments'
        run: |
          set -euo pipefail
          curl -fsSL -H "Authorization: Bearer $TOKEN" "$BASE/api/v1/deployments" -o "$RUNNER_TEMP/deps.json"
          python3 - <<'PY'
          import json, os
          d = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "deps.json"), encoding="utf-8"))
          arr = d if isinstance(d, list) else d.get("data") or d.get("deployments") or []
          print(f"进行中/最近部署={len(arr)}")
          for x in arr[:10]:
              print(f"  uuid={x.get('deployment_uuid') or x.get('uuid')} app={x.get('application_name')} status={x.get('status')} at={x.get('created_at')}")
          PY

      - name: 容器日志
        if: inputs.mode == 'logs'
        run: |
          set -euo pipefail
          test -n "${APP:-}" || { echo "需要 app_uuid"; exit 1; }
          trap 'rm -f "$RUNNER_TEMP/logs.out" "$RUNNER_TEMP/logs.curl.err"' EXIT
          set +e
          code=$(curl -sS -o "$RUNNER_TEMP/logs.out" -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" "$BASE/api/v1/applications/$APP/logs?lines=200" \
            2>"$RUNNER_TEMP/logs.curl.err")
          curl_exit=$?
          set -e
          python3 "KMFA/skills/每日资金/scripts/summarize_coolify_logs.py" \
            --input "$RUNNER_TEMP/logs.out" \
            --http-status "$code" \
            --curl-exit "$curl_exit"

      - name: 容器内只读诊断
        if: inputs.mode == 'exec'
        env:
          CMD: ${{ inputs.command }}
        run: |
          set -euo pipefail
          test -n "${APP:-}" || { echo "需要 app_uuid"; exit 1; }
          C="${CMD:-echo '--- date ---'; date; echo '--- crontab ---'; crontab -l 2>&1 | tail -20; echo '--- cron 进程 ---'; ps aux | grep -c '[c]ron'; echo '--- 台账 ---'; ls -la /var/log/kmfa 2>&1 | head -20; echo '--- 最近台账行 ---'; tail -5 /var/log/kmfa/ledger.jsonl 2>&1; echo '--- cron.log ---'; tail -20 /var/log/kmfa/cron.log 2>&1}"
          python3 - <<'PY' > "$RUNNER_TEMP/exec.json"
          import json, os
          print(json.dumps({"command": os.environ.get("C") or os.environ.get("CMD") or "date"}))
          PY
          # C 由 shell 展开，重新写入 payload 保证一致
          python3 -c "import json,os,sys;open(os.path.join(os.environ['RUNNER_TEMP'],'exec.json'),'w').write(json.dumps({'command':sys.argv[1]}))" "$C"
          code=$(curl -sS -o "$RUNNER_TEMP/exec.out" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data @"$RUNNER_TEMP/exec.json" "$BASE/api/v1/applications/$APP/execute" || true)
          echo "exec 返回码=$code"
          python3 - <<'PY'
          import os, re, json
          t = open(os.path.join(os.environ["RUNNER_TEMP"], "exec.out"), encoding="utf-8", errors="replace").read()
          try:
              d = json.loads(t); t = d.get("message") or d.get("output") or json.dumps(d, ensure_ascii=False)
          except Exception:
              pass
          print(re.sub(r"[A-Za-z0-9+/=]{40,}", "<REDACTED>", t)[:6000])
          PY

      - name: 同步钉钉凭据到 Coolify（值只在 runner 内流转）
        if: inputs.mode == 'sync-dingtalk'
        env:
          D_URL: ${{ secrets.KMFA_DINGTALK_ROBOT_URL }}
          D_KEY: ${{ secrets.KMFA_DINGTALK_ROBOT_SIGNING_KEY }}
        run: |
          set -euo pipefail
          test -n "${APP:-}" || { echo "需要 app_uuid"; exit 1; }
          sync_one() {   # $1=键名 $2=值
            [ -n "$2" ] || { echo "  $1: 仓库 secret 为空，跳过"; return 0; }
            python3 -c "import json,os,sys;open(os.path.join(os.environ['RUNNER_TEMP'],'p.json'),'w').write(json.dumps({'key':sys.argv[1],'value':sys.argv[2]}))" "$1" "$2"
            c=$(curl -sS -o "$RUNNER_TEMP/o" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data @"$RUNNER_TEMP/p.json" "$BASE/api/v1/applications/$APP/envs" || true)
            if [ "$c" != "200" ] && [ "$c" != "201" ]; then
              c=$(curl -sS -o "$RUNNER_TEMP/o" -w '%{http_code}' -X PATCH \
                -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
                --data @"$RUNNER_TEMP/p.json" "$BASE/api/v1/applications/$APP/envs" || true)
            fi
            rm -f "$RUNNER_TEMP/p.json"
            echo "  $1: 返回码 $c"
          }
          sync_one DINGTALK_ROBOT_URL "$D_URL"
          sync_one DINGTALK_ROBOT_SIGNING_KEY "$D_KEY"
          echo "完成（值全程未打印；GitHub 已自动 mask）"

      - name: 改一个非秘密开关（拒绝任何疑似秘密的键）
        if: inputs.mode == 'set-flag'
        env:
          FK: ${{ inputs.flag_key }}
          FV: ${{ inputs.flag_value }}
        run: |
          set -euo pipefail
          test -n "${APP:-}" || { echo "需要 app_uuid"; exit 1; }
          test -n "${FK:-}" || { echo "需要 flag_key"; exit 1; }
          case "$FK" in
            *TOKEN*|*KEY*|*SECRET*|*PASSWORD*|*SIGNING*|*URL*|*CODE*|*AUD*)
              echo "拒绝：$FK 疑似秘密键，set-flag 只允许非秘密开关"; exit 1;;
          esac
          python3 -c "import json,os,sys;open(os.path.join(os.environ['RUNNER_TEMP'],'f.json'),'w').write(json.dumps({'key':sys.argv[1],'value':sys.argv[2]}))" "$FK" "$FV"
          c=$(curl -sS -o "$RUNNER_TEMP/o" -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" --data @"$RUNNER_TEMP/f.json" "$BASE/api/v1/applications/$APP/envs" || true)
          [ "$c" = "200" ] || [ "$c" = "201" ] || c=$(curl -sS -o "$RUNNER_TEMP/o" -w '%{http_code}' -X PATCH \
              -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
              --data @"$RUNNER_TEMP/f.json" "$BASE/api/v1/applications/$APP/envs" || true)
          echo "$FK = $FV → 返回码 $c"

      # Access Application Audience tag 不是凭据，但它决定源站接受哪一个
      # Cloudflare Access 应用签发的 JWT。项目成本页面/API 使用两个更具体的
      # Access 应用，必须与既有 /api、/ops audience 一并写入；同名多份时
      # Coolify 的取值顺序不稳定，所以这里沿用「全删、重建一条、回读」。
      - name: 同步 Cloudflare Access audiences（去重并回读）
        if: inputs.mode == 'sync-access-aud'
        env:
          AUDS: ${{ inputs.flag_value }}
        run: |
          set -euo pipefail
          test -n "${APP:-}" || { echo "需要 app_uuid"; exit 1; }
          python3 - <<'PY'
          import os, re, sys
          values = [part.strip() for part in os.environ.get("AUDS", "").split(",")]
          if len(values) != 3 or len(set(values)) != 3:
              print("需要 3 个互不重复的 audience，以逗号分隔。")
              sys.exit(1)
          if any(re.fullmatch(r"[a-f0-9]{64}", value) is None for value in values):
              print("audience 格式错误；每项必须是 64 位小写十六进制。")
              sys.exit(1)
          PY
          echo "::add-mask::$AUDS"
          curl -fsSL -H "Authorization: Bearer $TOKEN" \
            "$BASE/api/v1/applications/$APP/envs" -o "$RUNNER_TEMP/e.json"
          python3 - > "$RUNNER_TEMP/targets.txt" <<'PY'
          import json, os
          data = json.load(open(
              os.path.join(os.environ["RUNNER_TEMP"], "e.json"),
              encoding="utf-8",
          ))
          envs = data if isinstance(data, list) else data.get("data") or []
          for item in envs:
              if str(item.get("key")) == "KMFA_CLOUDFLARE_ACCESS_AUD":
                  print(item.get("uuid") or "")
          PY
          while IFS= read -r uuid; do
            [ -n "$uuid" ] || continue
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $TOKEN" \
              "$BASE/api/v1/applications/$APP/envs/$uuid" || true)
            [ "$code" = "200" ] || [ "$code" = "204" ] || {
              echo "删除旧 audience 条目失败：HTTP $code"; exit 1; }
          done < "$RUNNER_TEMP/targets.txt"
          python3 - <<'PY' > "$RUNNER_TEMP/payload.json"
          import json, os
          print(json.dumps({
              "key": "KMFA_CLOUDFLARE_ACCESS_AUD",
              "value": os.environ["AUDS"],
          }))
          PY
          code=$(curl -sS -o "$RUNNER_TEMP/post.out" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            --data @"$RUNNER_TEMP/payload.json" \
            "$BASE/api/v1/applications/$APP/envs" || true)
          [ "$code" = "200" ] || [ "$code" = "201" ] || {
            echo "重建 audience 条目失败：HTTP $code"; exit 1; }
          curl -fsSL -H "Authorization: Bearer $TOKEN" \
            "$BASE/api/v1/applications/$APP/envs" -o "$RUNNER_TEMP/after.json"
          python3 - <<'PY'
          import collections, json, os, sys
          data = json.load(open(
              os.path.join(os.environ["RUNNER_TEMP"], "after.json"),
              encoding="utf-8",
          ))
          envs = data if isinstance(data, list) else data.get("data") or []
          counts = collections.Counter(str(item.get("key")) for item in envs)
          representation_count = collections.Counter(counts.values()).most_common(1)[0][0]
          # Docker Compose apps expose each environment row once per Coolify
          # context.  This app currently has production and preview contexts,
          # so every ordinary key appears twice.  Match that normal
          # multiplicity instead of treating the API representations as
          # conflicting duplicate values.
          if (
              representation_count not in (1, 2)
              or counts["KMFA_CLOUDFLARE_ACCESS_AUD"] != representation_count
          ):
              print("回读失败：audience 条目与应用正常上下文数不一致。")
              sys.exit(1)
          print("KMFA_CLOUDFLARE_ACCESS_AUD 已覆盖全部正常应用上下文。")
          PY

      - name: 同步项目成本私有只读源与工资密码（去重并回读）
        if: inputs.mode == 'sync-project-cost-secrets'
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.PRIVATE_DB_TOKEN }}
          PAYROLL_PASSWORD: ${{ secrets.KMFA_PAYROLL_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "${APP:-}" || { echo "需要 app_uuid"; exit 1; }
          test -n "${PRIVATE_READ_TOKEN:-}" || {
            echo "仓库缺 PRIVATE_DB_TOKEN（Private-Database contents:read）"; exit 1; }
          test -n "${PAYROLL_PASSWORD:-}" || {
            echo "仓库缺 KMFA_PAYROLL_PASSWORD"; exit 1; }
          echo "::add-mask::$PRIVATE_READ_TOKEN"
          echo "::add-mask::$PAYROLL_PASSWORD"
          curl -fsSL -H "Authorization: Bearer $TOKEN" \
            "$BASE/api/v1/applications/$APP/envs" -o "$RUNNER_TEMP/e.json"
          python3 - > "$RUNNER_TEMP/targets.txt" <<'PY'
          import json, os
          data = json.load(open(
              os.path.join(os.environ["RUNNER_TEMP"], "e.json"),
              encoding="utf-8",
          ))
          envs = data if isinstance(data, list) else data.get("data") or []
          target = {"KMFA_PRIVATE_DB_READ_TOKEN", "KMFA_PAYROLL_PASSWORD"}
          for item in envs:
              if str(item.get("key")) in target:
                  print(item.get("uuid") or "")
          PY
          while IFS= read -r uuid; do
            [ -n "$uuid" ] || continue
            code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE \
              -H "Authorization: Bearer $TOKEN" \
              "$BASE/api/v1/applications/$APP/envs/$uuid" || true)
            [ "$code" = "200" ] || [ "$code" = "204" ] || {
              echo "删除旧项目成本 secret 条目失败：HTTP $code"; exit 1; }
          done < "$RUNNER_TEMP/targets.txt"
          python3 - <<'PY' > "$RUNNER_TEMP/payloads.json"
          import json, os
          print(json.dumps([
              {
                  "key": "KMFA_PRIVATE_DB_READ_TOKEN",
                  "value": os.environ["PRIVATE_READ_TOKEN"],
              },
              {
                  "key": "KMFA_PAYROLL_PASSWORD",
                  "value": os.environ["PAYROLL_PASSWORD"],
              },
          ]))
          PY
          python3 - <<'PY' > "$RUNNER_TEMP/payload-lines.jsonl"
          import json, os
          for item in json.load(open(
              os.path.join(os.environ["RUNNER_TEMP"], "payloads.json"),
              encoding="utf-8",
          )):
              print(json.dumps(item))
          PY
          while IFS= read -r payload; do
            printf '%s\n' "$payload" > "$RUNNER_TEMP/payload.json"
            code=$(curl -sS -o "$RUNNER_TEMP/post.out" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              --data @"$RUNNER_TEMP/payload.json" \
              "$BASE/api/v1/applications/$APP/envs" || true)
            [ "$code" = "200" ] || [ "$code" = "201" ] || {
              echo "重建项目成本 secret 条目失败：HTTP $code"; exit 1; }
          done < "$RUNNER_TEMP/payload-lines.jsonl"
          curl -fsSL -H "Authorization: Bearer $TOKEN" \
            "$BASE/api/v1/applications/$APP/envs" -o "$RUNNER_TEMP/after.json"
          python3 - <<'PY'
          import collections, json, os, sys
          data = json.load(open(
              os.path.join(os.environ["RUNNER_TEMP"], "after.json"),
              encoding="utf-8",
          ))
          envs = data if isinstance(data, list) else data.get("data") or []
          counts = collections.Counter(str(item.get("key")) for item in envs)
          representation_count = collections.Counter(counts.values()).most_common(1)[0][0]
          if representation_count not in (1, 2):
              print("回读失败：应用环境上下文数量异常。")
              sys.exit(1)
          expected_keys = {
              "KMFA_PRIVATE_DB_READ_TOKEN",
              "KMFA_PAYROLL_PASSWORD",
          }
          for key in expected_keys:
              # Coolify omits secret values on readback.  Exact equality with
              # the GitHub secret is therefore unobservable here.  Require the
              # same number of representations as ordinary app keys, then
              # prove the values end-to-end after redeploy.
              if counts[key] != representation_count:
                  print(f"{key} 回读失败：未覆盖全部正常应用上下文。")
                  sys.exit(1)
          print("项目成本两个 secret 已覆盖全部正常应用上下文。")
          PY

      # 每日资金是一条独立的数据面：不能借用项目成本或其他 KMFA 服务的
      # 凭据。12 个运行必填值先在 GitHub Secret Store 完整存在才开始写
      # Coolify；可选 DWS client override 与 recovery bundle 只在显式配置时
      # 一并同步。Coolify 的 PATCH 只更新既有键、缺失键明确返回 404；因此
      # 对每个键先 PATCH，且仅在该 404 时 POST 创建。POST 因并发创建返回
      # 409 时再 PATCH 一次。全程不删除既有变量；同步失败时不会触发部署，
      # 运行中的容器继续保留上一份完整配置。
      - name: 同步每日资金专用 secrets（必填全量、可选 DWS 覆盖/恢复包、值不回显）
        if: inputs.mode == 'sync-daily-funds-secrets'
        env:
          DAILY_FUNDS_GROUP_ID: ${{ secrets.DAILY_FUNDS_GROUP_ID }}
          DAILY_FUNDS_SENDER_ID: ${{ secrets.DAILY_FUNDS_SENDER_ID }}
          DAILY_FUNDS_DWS_CLIENT_ID: ${{ secrets.DAILY_FUNDS_DWS_CLIENT_ID }}
          DAILY_FUNDS_DWS_AUTH_BUNDLE_B64: ${{ secrets.DAILY_FUNDS_DWS_AUTH_BUNDLE_B64 }}
          DAILY_FUNDS_GIT_SSH_KEY_B64: ${{ secrets.DAILY_FUNDS_GIT_SSH_KEY_B64 }}
          DAILY_FUNDS_CLOUDFLARE_API_TOKEN: ${{ secrets.DAILY_FUNDS_CLOUDFLARE_API_TOKEN }}
          DAILY_FUNDS_CF_ACCOUNT_ID: ${{ secrets.DAILY_FUNDS_CF_ACCOUNT_ID }}
          DAILY_FUNDS_D1_DATABASE_ID: ${{ secrets.DAILY_FUNDS_D1_DATABASE_ID }}
          DAILY_FUNDS_RESTORE_DRILL_D1_DATABASE_ID: ${{ secrets.DAILY_FUNDS_RESTORE_DRILL_D1_DATABASE_ID }}
          DAILY_FUNDS_R2_ENDPOINT_URL: ${{ secrets.DAILY_FUNDS_R2_ENDPOINT_URL }}
          DAILY_FUNDS_R2_BUCKET: ${{ secrets.DAILY_FUNDS_R2_BUCKET }}
          DAILY_FUNDS_R2_ACCESS_KEY_ID: ${{ secrets.DAILY_FUNDS_R2_ACCESS_KEY_ID }}
          DAILY_FUNDS_R2_SECRET_ACCESS_KEY: ${{ secrets.DAILY_FUNDS_R2_SECRET_ACCESS_KEY }}
          DAILY_FUNDS_OCI_PAR_URL: ${{ secrets.DAILY_FUNDS_OCI_PAR_URL }}
        run: |
          set -euo pipefail
          test -n "${APP:-}" || { echo "需要 app_uuid"; exit 1; }
          required_keys=(
            DAILY_FUNDS_GROUP_ID
            DAILY_FUNDS_SENDER_ID
            DAILY_FUNDS_GIT_SSH_KEY_B64
            DAILY_FUNDS_CLOUDFLARE_API_TOKEN
            DAILY_FUNDS_CF_ACCOUNT_ID
            DAILY_FUNDS_D1_DATABASE_ID
            DAILY_FUNDS_RESTORE_DRILL_D1_DATABASE_ID
            DAILY_FUNDS_R2_ENDPOINT_URL
            DAILY_FUNDS_R2_BUCKET
            DAILY_FUNDS_R2_ACCESS_KEY_ID
            DAILY_FUNDS_R2_SECRET_ACCESS_KEY
            DAILY_FUNDS_OCI_PAR_URL
          )
          optional_keys=(DAILY_FUNDS_DWS_CLIENT_ID DAILY_FUNDS_DWS_AUTH_BUNDLE_B64)
          missing=()
          for key in "${required_keys[@]}"; do
            value="${!key:-}"
            if [ -z "$value" ]; then
              missing+=("$key")
            else
              echo "::add-mask::$value"
            fi
          done
          for key in "${optional_keys[@]}"; do
            value="${!key:-}"
            [ -z "$value" ] || echo "::add-mask::$value"
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            printf '仓库缺每日资金 secret：%s\n' "${missing[*]}"
            exit 1
          fi
          python3 - <<'PY' > "$RUNNER_TEMP/daily-funds-payloads.jsonl"
          import json
          import os

          required = (
              "DAILY_FUNDS_GROUP_ID", "DAILY_FUNDS_SENDER_ID",
              "DAILY_FUNDS_GIT_SSH_KEY_B64",
              "DAILY_FUNDS_CLOUDFLARE_API_TOKEN", "DAILY_FUNDS_CF_ACCOUNT_ID",
              "DAILY_FUNDS_D1_DATABASE_ID", "DAILY_FUNDS_RESTORE_DRILL_D1_DATABASE_ID",
              "DAILY_FUNDS_R2_ENDPOINT_URL", "DAILY_FUNDS_R2_BUCKET",
              "DAILY_FUNDS_R2_ACCESS_KEY_ID", "DAILY_FUNDS_R2_SECRET_ACCESS_KEY",
              "DAILY_FUNDS_OCI_PAR_URL",
          )
          optional = ("DAILY_FUNDS_DWS_CLIENT_ID", "DAILY_FUNDS_DWS_AUTH_BUNDLE_B64")
          keys = required + tuple(key for key in optional if os.environ.get(key))
          for key in keys:
              print(json.dumps({"key": key, "value": os.environ[key]}))
          PY
          while IFS= read -r payload; do
            printf '%s\n' "$payload" > "$RUNNER_TEMP/daily-funds-payload.json"
            code=$(curl -sS -o "$RUNNER_TEMP/daily-funds-patch.out" -w '%{http_code}' -X PATCH \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              --data @"$RUNNER_TEMP/daily-funds-payload.json" \
              "$BASE/api/v1/applications/$APP/envs" || true)
            if [ "$code" = "404" ]; then
              code=$(curl -sS -o "$RUNNER_TEMP/daily-funds-post.out" -w '%{http_code}' -X POST \
                -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" \
                --data @"$RUNNER_TEMP/daily-funds-payload.json" \
                "$BASE/api/v1/applications/$APP/envs" || true)
              if [ "$code" = "409" ]; then
                code=$(curl -sS -o "$RUNNER_TEMP/daily-funds-patch-retry.out" -w '%{http_code}' -X PATCH \
                  -H "Authorization: Bearer $TOKEN" \
                  -H "Content-Type: application/json" \
                  --data @"$RUNNER_TEMP/daily-funds-payload.json" \
                  "$BASE/api/v1/applications/$APP/envs" || true)
              fi
            fi
            [ "$code" = "200" ] || [ "$code" = "201" ] || {
              echo "更新每日资金 secret 条目失败：HTTP $code"; exit 1; }
          done < "$RUNNER_TEMP/daily-funds-payloads.jsonl"
          curl -fsSL -H "Authorization: Bearer $TOKEN" \
            "$BASE/api/v1/applications/$APP/envs" -o "$RUNNER_TEMP/daily-funds-envs-after.json"
          python3 - <<'PY'
          import collections
          import json
          import os
          import sys

          required = {
              "DAILY_FUNDS_GROUP_ID", "DAILY_FUNDS_SENDER_ID",
              "DAILY_FUNDS_GIT_SSH_KEY_B64",
              "DAILY_FUNDS_CLOUDFLARE_API_TOKEN", "DAILY_FUNDS_CF_ACCOUNT_ID",
              "DAILY_FUNDS_D1_DATABASE_ID", "DAILY_FUNDS_RESTORE_DRILL_D1_DATABASE_ID",
              "DAILY_FUNDS_R2_ENDPOINT_URL", "DAILY_FUNDS_R2_BUCKET",
              "DAILY_FUNDS_R2_ACCESS_KEY_ID", "DAILY_FUNDS_R2_SECRET_ACCESS_KEY",
              "DAILY_FUNDS_OCI_PAR_URL",
          }
          optional = {"DAILY_FUNDS_DWS_CLIENT_ID", "DAILY_FUNDS_DWS_AUTH_BUNDLE_B64"}
          expected = required | {key for key in optional if os.environ.get(key)}
          data = json.load(open(
              os.path.join(os.environ["RUNNER_TEMP"], "daily-funds-envs-after.json"),
              encoding="utf-8",
          ))
          envs = data if isinstance(data, list) else data.get("data") or []
          # The endpoint merges production and preview variables.  The daily
          # funds worker only runs in the production context, so requiring a
          # mirrored preview row would both misreport a valid deployment and
          # needlessly copy financial credentials into preview environments.
          production = [
              item for item in envs
              if isinstance(item, dict) and not bool(item.get("is_preview", False))
          ]
          counts = collections.Counter(str(item.get("key")) for item in production)
          for key in expected:
              # Coolify readback may hide secret values.  This proves all
              # production runtime entries exist exactly once; value equality is
              # intentionally left for a later in-container acceptance run.
              if counts[key] != 1:
                  print(f"{key} 回读失败：生产运行上下文不是恰好一条。")
                  sys.exit(1)
          print("每日资金 12 个必填 secret 已通过 Coolify PATCH/POST 覆盖生产运行上下文；可选 DWS 客户端覆盖和恢复包仅在显式配置时同步，值一致性待运行时验收。")
          PY

      - name: 测试期安全态——清空群机器人 + 关投递（去重后重写，杜绝同名残留）
        if: inputs.mode == 'testing-safe-mode'
        run: |
          set -euo pipefail
          test -n "${APP:-}" || { echo "需要 app_uuid"; exit 1; }
          curl -fsSL -H "Authorization: Bearer $TOKEN" "$BASE/api/v1/applications/$APP/envs" -o "$RUNNER_TEMP/e.json"
          # 列出目标键的所有条目 uuid（同名可能有多份→只改一份会留下危险残留）
          python3 - > "$RUNNER_TEMP/targets.txt" <<'PY2'
          import json, os
          d = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "e.json"), encoding="utf-8"))
          envs = d if isinstance(d, list) else d.get("data") or []
          TARGET = {"DINGTALK_ROBOT_URL", "DINGTALK_ROBOT_SIGNING_KEY", "KMFA_DELIVERY_ENABLED"}
          for e in envs:
              k = str(e.get("key"))
              if k in TARGET:
                  print(f"{k}\t{e.get('uuid') or ''}")
          PY2
          echo "命中条目："; cat "$RUNNER_TEMP/targets.txt"
          # 逐条删除（删除即安全：群地址没了发不出群；投递默认 0）
          while IFS=$'\t' read -r k u; do
            [ -n "$u" ] || continue
            c=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $TOKEN" \
                "$BASE/api/v1/applications/$APP/envs/$u" || true)
            echo "  删除 $k($u) → $c"
          done < "$RUNNER_TEMP/targets.txt"
          # 只重建一条 KMFA_DELIVERY_ENABLED=0；群机器人保持缺失=群通道不可用
          python3 -c "import json,os;open(os.path.join(os.environ['RUNNER_TEMP'],'d.json'),'w').write(json.dumps({'key':'KMFA_DELIVERY_ENABLED','value':'0'}))"
          c=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" --data @"$RUNNER_TEMP/d.json" "$BASE/api/v1/applications/$APP/envs" || true)
          echo "重建 KMFA_DELIVERY_ENABLED=0 → $c"
          echo "测试期安全态完成：群机器人凭据已从 Coolify 移除，投递关闭。"

      # ── testing-safe-mode 的反向操作 ───────────────────────────────────────
      #
      # 为什么需要它，而不是用 set-flag 把 KMFA_DELIVERY_ENABLED 改成 1：
      #
      #   1. **同名条目**。Coolify 里同一个键可能存着两份，谁赢不确定（本仓踩过：
      #      两份 KMFA_CLOUDFLARE_ACCESS_AUD，空的那份赢）。set-flag 只写一份，
      #      另一份 '0' 可能仍然生效——于是「开关显示已开、实际没发」，
      #      比原来那个「跑绿不投递」更难查。这里沿用 testing-safe-mode 的
      #      「全删再重建一条」，让终态无歧义。
      #
      #   2. **安全联锁**。开投递这个动作本身没风险，风险在于「开投递 + 群机器人
      #      凭据还在」= 可能发进真实群，而 Owner 明令测试期不许发群。
      #      所以这里先查群凭据，只要还在就**当场中止**，不给「先开了再说」的机会。
      #      联锁是机械的：不依赖执行的人记得检查。
      #
      #   3. **显式写 personal**。run_skill.sh 的默认值已经是 personal，但默认值
      #      是代码里的约定，面板上看不见。显式写一条，让「只发本人」这件事
      #      在 Coolify 面板上是**看得见的事实**，而不是要读源码才知道的推断。
      - name: 开投递——只发本人（群凭据仍在则中止）
        if: inputs.mode == 'delivery-personal-on'
        run: |
          set -euo pipefail
          test -n "${APP:-}" || { echo "需要 app_uuid"; exit 1; }
          curl -fsSL -H "Authorization: Bearer $TOKEN" "$BASE/api/v1/applications/$APP/envs" -o "$RUNNER_TEMP/e.json"

          # ① 安全联锁：群机器人凭据只要有一个「有值」，立刻中止。
          python3 - <<'PY2'
          import json, os, sys
          d = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "e.json"), encoding="utf-8"))
          envs = d if isinstance(d, list) else d.get("data") or []
          ROBOT = {"DINGTALK_ROBOT_URL", "DINGTALK_ROBOT_SIGNING_KEY"}
          live = [str(e.get("key")) for e in envs
                  if str(e.get("key")) in ROBOT and (e.get("value") not in (None, ""))]
          if live:
              print(f"中止：群机器人凭据仍在（{sorted(set(live))}）。")
              print("开投递前必须先跑 testing-safe-mode 清掉它们——"
                    "Owner 明令测试期不许发群，凭据在就存在发群的可能。")
              sys.exit(1)
          print("联锁通过：群机器人凭据缺失 ⇒ 群通道结构上不可用。")
          PY2

          # ② 列出两个目标键的**全部**条目（同名多份要一并清掉）
          python3 - > "$RUNNER_TEMP/targets.txt" <<'PY2'
          import json, os
          d = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "e.json"), encoding="utf-8"))
          envs = d if isinstance(d, list) else d.get("data") or []
          TARGET = {"KMFA_DELIVERY_ENABLED", "KMFA_NOTIFICATION_TARGETS"}
          for e in envs:
              k = str(e.get("key"))
              if k in TARGET:
                  print(f"{k}\t{e.get('uuid') or ''}\t{e.get('value')!r}")
          PY2
          echo "命中条目（键 / uuid / 现值）："; cat "$RUNNER_TEMP/targets.txt"
          while IFS=$'\t' read -r k u v; do
            [ -n "$u" ] || continue
            c=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $TOKEN" \
                "$BASE/api/v1/applications/$APP/envs/$u" || true)
            echo "  删除 $k($u) → $c"
          done < "$RUNNER_TEMP/targets.txt"

          # ③ 各重建一条，终态唯一
          for pair in "KMFA_DELIVERY_ENABLED=1" "KMFA_NOTIFICATION_TARGETS=personal"; do
            K="${pair%%=*}"; V="${pair#*=}"
            python3 -c "import json,os,sys;open(os.path.join(os.environ['RUNNER_TEMP'],'p.json'),'w').write(json.dumps({'key':sys.argv[1],'value':sys.argv[2]}))" "$K" "$V"
            c=$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $TOKEN" \
                -H "Content-Type: application/json" --data @"$RUNNER_TEMP/p.json" "$BASE/api/v1/applications/$APP/envs" || true)
            echo "  重建 $K=$V → $c"
          done

          # ④ 回读校验：不信任写入的返回码，只信读回来的终态。
          curl -fsSL -H "Authorization: Bearer $TOKEN" "$BASE/api/v1/applications/$APP/envs" -o "$RUNNER_TEMP/after.json"
          python3 - <<'PY2'
          import json, os, sys
          d = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "after.json"), encoding="utf-8"))
          envs = d if isinstance(d, list) else d.get("data") or []
          got = {}
          for e in envs:
              k = str(e.get("key"))
              if k in {"KMFA_DELIVERY_ENABLED", "KMFA_NOTIFICATION_TARGETS"}:
                  got.setdefault(k, []).append(e.get("value"))
          print("终态：", json.dumps(got, ensure_ascii=False))
          bad = [k for k, vs in got.items() if len(set(map(str, vs))) != 1]
          if bad:
              print(f"失败：{bad} 仍有取值不一致的同名条目——终态有歧义，不算开成功。")
              sys.exit(1)
          if str(got.get("KMFA_DELIVERY_ENABLED", [None])[0]) != "1":
              print("失败：KMFA_DELIVERY_ENABLED 回读不是 1。"); sys.exit(1)
          if str(got.get("KMFA_NOTIFICATION_TARGETS", [None])[0]) != "personal":
              print("失败：KMFA_NOTIFICATION_TARGETS 回读不是 personal。"); sys.exit(1)
          print("投递已开，且只发本人。生效需要 redeploy。")
          PY2

      # 部署失败时唯一能看到原因的地方。
      #
      # 为什么不能用现成的 `deployments` 模式：`/api/v1/deployments` **只返回
      # 进行中的部署**（#251 已经踩过一次并记下来了），稳态恒为空数组——
      # 部署失败之后再去查，永远是「最近部署=0」，而失败原因就此消失。
      # 要拿失败的那一次，必须**按 deployment uuid 直取**。
      #
      # uuid 从 deploy workflow 的日志里拿（它触发时会打印 deployment_uuid）。
      - name: 取一次部署的完整日志（按 deployment uuid 直取）
        if: inputs.mode == 'deployment-log'
        env:
          DUUID: ${{ inputs.command }}
        run: |
          set -euo pipefail
          test -n "${DUUID:-}" || {
            echo "需要把 deployment uuid 放在 command 输入里"; exit 1; }
          code=$(curl -sS -o "$RUNNER_TEMP/dep.json" -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN" "$BASE/api/v1/deployments/$DUUID" || true)
          echo "返回码=$code"
          python3 - <<'PY'
          import json, os, re
          raw = open(os.path.join(os.environ["RUNNER_TEMP"], "dep.json"),
                     encoding="utf-8", errors="replace").read()
          try:
              data = json.loads(raw)
          except Exception:
              print(raw[:4000]); raise SystemExit(0)
          print("status =", data.get("status"))
          print("commit =", data.get("commit"))
          logs = data.get("logs")
          if isinstance(logs, str):
              try:
                  logs = json.loads(logs)
              except Exception:
                  logs = [{"output": logs}]
          lines = []
          for item in (logs or []):
              text = item.get("output") if isinstance(item, dict) else str(item)
              lines.extend(str(text).splitlines())
          # 本仓是 PUBLIC，日志公开可读：凡像密钥的一律遮掉再打。
          SECRET = re.compile(
              r"(gh[pousr]_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{16,}|"
              r"xox[bap]-[A-Za-z0-9-]{10,}|Bearer\s+\S+|[A-Fa-f0-9]{40,})")
          print(f"--- 共 {len(lines)} 行，打末尾 120 行 ---")
          for line in lines[-120:]:
              print(SECRET.sub("<redacted>", line))
          PY

      # Coolify 允许明确取消“queued / in_progress”的指定 deployment。只使用
      # 不透明 UUID，既不读取 build args，也不改应用、卷或环境变量；用于释放
      # 已明确失败却被平台遗留为 in_progress 的队列占位。
      - name: 取消卡死的指定部署（仅 deployment uuid）
        if: inputs.mode == 'cancel-deployment'
        env:
          DUUID: ${{ inputs.command }}
        run: |
          set -euo pipefail
          test -n "${DUUID:-}" || {
            echo "cancel-deployment 需要在 command 提供 deployment uuid"; exit 1; }
          code=$(curl -sS -o "$RUNNER_TEMP/cancel.json" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $TOKEN" "$BASE/api/v1/deployments/$DUUID/cancel" || true)
          echo "cancel_http_status=$code"
          CANCEL_HTTP_STATUS="$code" python3 - <<'PY'
          import json, os, sys
          raw = open(os.path.join(os.environ["RUNNER_TEMP"], "cancel.json"), encoding="utf-8", errors="replace").read()
          try:
              data = json.loads(raw)
          except json.JSONDecodeError:
              data = {}
          print("cancel_message=" + str(data.get("message") or ""))
          print("cancel_deployment_uuid=" + str(data.get("deployment_uuid") or ""))
          print("cancel_status=" + str(data.get("status") or ""))
          if os.environ.get("CANCEL_HTTP_STATUS") != "200":
              print("cancel_result=FAILED")
              sys.exit(1)
          print("cancel_result=OK")
          PY

      - name: 触发重新部署
        if: inputs.mode == 'redeploy'
        run: |
          set -euo pipefail
          test -n "${APP:-}" || { echo "需要 app_uuid"; exit 1; }
          curl -fsSL -X POST -H "Authorization: Bearer $TOKEN" \
            "$BASE/api/v1/deploy?uuid=$APP" -o "$RUNNER_TEMP/dep.json"
          python3 -c "import json,os;d=json.load(open(os.path.join(os.environ['RUNNER_TEMP'],'dep.json')));print('部署已触发:',json.dumps(d,ensure_ascii=False)[:300])"
