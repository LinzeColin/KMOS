name: cashflow-safe-diagnostic

# Temporary branch-only diagnostic.  It is deliberately excluded from main:
# it publishes only parser/category status and coverage counts, never raw OCR,
# filenames, account identifiers, counterparties, or money values.
on:
  push:
    branches:
      - codex/daily-funds-flow-visual-20260811
    paths:
      - KMFA/skills/每日资金/daily_funds/parsing.py
      - KMFA/skills/每日资金/tests/test_daily_funds_contract.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: safe-cashflow-diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DAILY_FUNDS_GROUP_ID: ${{ secrets.DAILY_FUNDS_GROUP_ID }}
      DAILY_FUNDS_SENDER_ID: ${{ secrets.DAILY_FUNDS_SENDER_ID }}
      DAILY_FUNDS_GIT_SSH_KEY_B64: ${{ secrets.DAILY_FUNDS_GIT_SSH_KEY_B64 }}
      DAILY_FUNDS_OCR_ENABLED: "1"
      DAILY_FUNDS_OCR_MIN_CONFIDENCE: "0.98"
    steps:
      - uses: actions/checkout@v4

      - name: Build isolated daily-funds parser
        run: docker build -f KMFA/skills/每日资金/Dockerfile -t kmfa-daily-funds:safe-diagnostic .

      - name: Compute safe source and parser receipt
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e DAILY_FUNDS_GROUP_ID \
            -e DAILY_FUNDS_SENDER_ID \
            -e DAILY_FUNDS_GIT_SSH_KEY_B64 \
            -e DAILY_FUNDS_OCR_ENABLED \
            -e DAILY_FUNDS_OCR_MIN_CONFIDENCE \
            -v "${RUNNER_TEMP}:/audit" \
            --entrypoint /bin/sh \
            kmfa-daily-funds:safe-diagnostic -ec '
              python3 -c "import base64; exec(compile(base64.b64decode(\"\"), \"<cashflow-safe-layout-diagnostic>\", \"exec\"))"
            '

      - name: Raw archive is verified
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; raise SystemExit(not json.loads(Path('${RUNNER_TEMP}/cashflow-safe.json').read_text())['archive_verified'])"

      - name: No CASHFLOW_OBSERVATION_HEADER_MISSING failures
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-safe.json').read_text()); raise SystemExit(bool(d.get('parser_failure_codes', {}).get('CASHFLOW_OBSERVATION_HEADER_MISSING')))"

      - name: Every source document exposes a business-date header alias
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-safe.json').read_text()); raise SystemExit(d.get('field_coverage', {}).get('business_date') != d.get('coverage', {}).get('eligible_documents'))"

      - name: Every source document exposes an inflow header alias
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-safe.json').read_text()); raise SystemExit(d.get('field_coverage', {}).get('inflow') != d.get('coverage', {}).get('eligible_documents'))"

      - name: Every source document exposes an outflow header alias
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-safe.json').read_text()); raise SystemExit(d.get('field_coverage', {}).get('outflow') != d.get('coverage', {}).get('eligible_documents'))"

      - name: Every source document exposes a bank header alias
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-safe.json').read_text()); raise SystemExit(d.get('field_coverage', {}).get('bank') != d.get('coverage', {}).get('eligible_documents'))"

      - name: All source headers form at zero-pixel vertical gap
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-safe.json').read_text()); raise SystemExit(d.get('gap_coverage', {}).get('0') != d.get('coverage', {}).get('eligible_documents'))"

      - name: All source headers form at two-pixel vertical gap
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-safe.json').read_text()); raise SystemExit(d.get('gap_coverage', {}).get('2') != d.get('coverage', {}).get('eligible_documents'))"

      - name: All source headers form at four-pixel vertical gap
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-safe.json').read_text()); raise SystemExit(d.get('gap_coverage', {}).get('4') != d.get('coverage', {}).get('eligible_documents'))"

      - name: All source headers form at eight-pixel vertical gap
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-safe.json').read_text()); raise SystemExit(d.get('gap_coverage', {}).get('8') != d.get('coverage', {}).get('eligible_documents'))"

      - name: All source headers form at twelve-pixel vertical gap
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-safe.json').read_text()); raise SystemExit(d.get('gap_coverage', {}).get('12') != d.get('coverage', {}).get('eligible_documents'))"

      - name: All source headers form at sixteen-pixel vertical gap
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-safe.json').read_text()); raise SystemExit(d.get('gap_coverage', {}).get('16') != d.get('coverage', {}).get('eligible_documents'))"

      - name: All source headers form at twenty-four-pixel vertical gap
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-safe.json').read_text()); raise SystemExit(d.get('gap_coverage', {}).get('24') != d.get('coverage', {}).get('eligible_documents'))"

      - name: No CASHFLOW_OBSERVATION_HEADER_AMBIGUOUS failures
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-safe.json').read_text()); raise SystemExit(bool(d.get('parser_failure_codes', {}).get('CASHFLOW_OBSERVATION_HEADER_AMBIGUOUS')))"

      - name: No OCR_LOW_CONFIDENCE failures
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-safe.json').read_text()); raise SystemExit(bool(d.get('parser_failure_codes', {}).get('OCR_LOW_CONFIDENCE')))"

      - name: No CASHFLOW_OBSERVATION_ROWS_EMPTY failures
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-safe.json').read_text()); raise SystemExit(bool(d.get('parser_failure_codes', {}).get('CASHFLOW_OBSERVATION_ROWS_EMPTY')))"

      - name: No CASHFLOW_OBSERVATION_TOTAL_MISSING failures
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-safe.json').read_text()); raise SystemExit(bool(d.get('parser_failure_codes', {}).get('CASHFLOW_OBSERVATION_TOTAL_MISSING')))"

      - name: No CASHFLOW_OBSERVATION_TOTAL_MISMATCH failures
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-safe.json').read_text()); raise SystemExit(bool(d.get('parser_failure_codes', {}).get('CASHFLOW_OBSERVATION_TOTAL_MISMATCH')))"

      - name: No CASHFLOW_OBSERVATION_DATE failures
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-safe.json').read_text()); c=d.get('parser_failure_codes', {}); raise SystemExit(any(c.get(k) for k in ('CASHFLOW_OBSERVATION_DATE_MISSING', 'CASHFLOW_OBSERVATION_DATE_INVALID', 'CASHFLOW_OBSERVATION_DATE_OUT_OF_RANGE', 'CASHFLOW_OBSERVATION_DATE_AMBIGUOUS')))"

      - name: No CASHFLOW_OBSERVATION_AMOUNT failures
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-safe.json').read_text()); c=d.get('parser_failure_codes', {}); raise SystemExit(any(c.get(k) for k in ('CASHFLOW_OBSERVATION_AMOUNT_INVALID', 'CASHFLOW_OBSERVATION_AMOUNT_NEGATIVE', 'CASHFLOW_OBSERVATION_ZERO_ROW')))"

      - name: No unclassified parser failures
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-safe.json').read_text()); known={'CASHFLOW_OBSERVATION_HEADER_MISSING','CASHFLOW_OBSERVATION_HEADER_AMBIGUOUS','OCR_LOW_CONFIDENCE','CASHFLOW_OBSERVATION_ROWS_EMPTY','CASHFLOW_OBSERVATION_TOTAL_MISSING','CASHFLOW_OBSERVATION_TOTAL_MISMATCH','CASHFLOW_OBSERVATION_DATE_MISSING','CASHFLOW_OBSERVATION_DATE_INVALID','CASHFLOW_OBSERVATION_DATE_OUT_OF_RANGE','CASHFLOW_OBSERVATION_DATE_AMBIGUOUS','CASHFLOW_OBSERVATION_AMOUNT_INVALID','CASHFLOW_OBSERVATION_AMOUNT_NEGATIVE','CASHFLOW_OBSERVATION_ZERO_ROW'}; raise SystemExit(bool(set(d.get('parser_failure_codes', {})) - known))"

      - name: Observation aggregation is VERIFIED
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-safe.json').read_text()); raise SystemExit(d.get('aggregation', {}).get('machine_code') != 'CASHFLOW_OBSERVATION_VERIFIED')"

      - name: Aggregation has no duplicate business day
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-safe.json').read_text()); raise SystemExit(d.get('aggregation', {}).get('machine_code') == 'CASHFLOW_OBSERVATION_DUPLICATE_DAY')"

      - name: Aggregation has sufficient business-day coverage
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-safe.json').read_text()); raise SystemExit(d.get('aggregation', {}).get('machine_code') == 'CASHFLOW_OBSERVATION_COVERAGE_INSUFFICIENT')"
