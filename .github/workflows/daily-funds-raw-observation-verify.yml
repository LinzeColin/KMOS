name: daily-funds-raw-observation-verify

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DAILY_FUNDS_GROUP_ID: ${{ secrets.DAILY_FUNDS_GROUP_ID }}
      DAILY_FUNDS_SENDER_ID: ${{ secrets.DAILY_FUNDS_SENDER_ID }}
      DAILY_FUNDS_GIT_SSH_KEY_B64: ${{ secrets.DAILY_FUNDS_GIT_SSH_KEY_B64 }}
      DAILY_FUNDS_OCR_ENABLED: "1"
      DAILY_FUNDS_OCR_MIN_CONFIDENCE: "0.98"
    steps:
      - uses: actions/checkout@v4

      - name: Re-open private raw authority and verify chart-only observation
        shell: bash
        run: |
          set -euo pipefail
          docker build -f KMFA/skills/每日资金/Dockerfile -t kmfa-daily-funds:raw-observation .
          docker run --rm \
            -e DAILY_FUNDS_GROUP_ID \
            -e DAILY_FUNDS_SENDER_ID \
            -e DAILY_FUNDS_GIT_SSH_KEY_B64 \
            -e DAILY_FUNDS_OCR_ENABLED \
            -e DAILY_FUNDS_OCR_MIN_CONFIDENCE \
            --entrypoint /bin/sh \
            kmfa-daily-funds:raw-observation -ec '
              python3 /opt/daily-funds/scripts/run_daily_funds.py raw-archive-audit
              python3 - <<"PY"
              import json
              from pathlib import Path

              target = Path("/var/lib/kmfa/daily-funds-publication/cashflow_observation.json")
              payload = json.loads(target.read_text(encoding="utf-8"))
              coverage = payload.get("source_coverage") if isinstance(payload, dict) else None
              if not isinstance(coverage, dict):
                  raise SystemExit("CASHFLOW_OBSERVATION_RECEIPT_INVALID")
              result = {
                  "status": payload.get("status"),
                  "machine_code": payload.get("machine_code"),
                  "eligible_documents": coverage.get("eligible_documents"),
                  "parsed_documents": coverage.get("parsed_documents"),
                  "rejected_documents": coverage.get("rejected_documents"),
                  "distinct_business_days": coverage.get("distinct_business_days"),
                  "point_count": len(payload.get("points", [])),
              }
              print(json.dumps(result, ensure_ascii=True, sort_keys=True))
              if result["status"] != "VERIFIED" or result["machine_code"] != "CASHFLOW_OBSERVATION_VERIFIED":
                  raise SystemExit("CASHFLOW_OBSERVATION_NOT_VERIFIED")
              PY
            '
