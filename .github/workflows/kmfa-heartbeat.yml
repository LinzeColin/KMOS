name: kmfa-heartbeat
# 站点心跳：每小时以匿名 `/healthz` 判定 KMFA 应用是否可用。只有该浅健康
# 探测自身不可达时才允许触发重新部署；业务技能红色是需要处理的真实状态，
# 但不是容器宕机的证据，重启也不能制造来源、登录态或勾稽事实。
#
# 防抖动三条（不做的话它会把自己变成噪音源）：
#   · 只有距上次部署 ≥2 小时才允许再次触发，避免部署风暴；
#   · 连续失败次数达阈值才动手，一次失败不折腾（排程本身就会重试）；
#   · 每次都把判据打出来，人能复核它为什么动手。
on:
  schedule:
    # 每小时第 23 分：避开整点——全网 cron 都挤在 :00，那一刻最容易被限流延迟。
    - cron: "23 * * * *"
  workflow_dispatch:

permissions: { contents: read }

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: 探健康 + 判定是否需要自愈
        id: probe
        run: |
          python3 - <<'PY' | tee /tmp/beat.txt
          import json, urllib.request, urllib.parse, urllib.error, os, sys
          base = "https://kmfa.linzezhang.com"
          # Availability and business truth are separate probes.  A daily-funds
          # source/reconciliation failure is red, but restarting an otherwise
          # reachable application cannot manufacture a valid source fact.
          availability_url = base + "/healthz"
          skill_health_url = base + "/public-api/" + urllib.parse.quote("技能健康")
          headers = {
              "User-Agent": "KMFA-Heartbeat/1.0 (+https://github.com/LinzeColin/KMOS)",
              "Accept": "application/json"}

          # `/healthz` is deliberately anonymous and values-free.  It is the
          # only probe allowed to request a Coolify restart: a 5xx or transport
          # failure here means the application itself is unavailable.  A 4xx is
          # an edge/policy defect and must not cause a useless restart.
          try:
              with urllib.request.urlopen(
                  urllib.request.Request(availability_url, headers=headers), timeout=25,
              ) as r:
                  availability = json.loads(r.read().decode())
          except Exception as e:
              code = getattr(e, "code", None)
              print(f"AVAILABILITY_PROBE_FAILED={type(e).__name__} HTTP={code}")
              print("RED=1")
              if code is not None and 400 <= code < 500:
                  print("NEED_HEAL=0")
                  print(f"REASON=浅健康端点返回 {code}——边缘/策略异常，部署修不了")
              else:
                  print("NEED_HEAL=1")
                  print(f"REASON=浅健康端点探测失败（HTTP={code}）——站点或应用不可达")
              raise SystemExit(0)

          if not isinstance(availability, dict) or availability.get("status") != "ok":
              print("RED=1")
              print("NEED_HEAL=0")
              print("REASON=浅健康返回形状异常——不把未知响应当作可重启故障")
              raise SystemExit(0)

          # This second probe carries business status only.  It must never
          # itself trigger a restart after the anonymous liveness probe passed.
          try:
              with urllib.request.urlopen(
                  urllib.request.Request(skill_health_url, headers=headers), timeout=25,
              ) as r:
                  d = json.loads(r.read().decode())
          except Exception as e:
              code = getattr(e, "code", None)
              print(f"SKILL_HEALTH_PROBE_FAILED={type(e).__name__} HTTP={code}")
              print("RED=1")
              print("NEED_HEAL=0")
              print("REASON=公开技能健康不可读，但浅健康已通过；不重启以掩盖业务状态")
              raise SystemExit(0)

          if not isinstance(d, dict) or not d.get("台账可读"):
              print("RED=1")
              print("NEED_HEAL=0")
              print("REASON=台账不可读，但浅健康已通过；需修复运行态而非重复重启")
              raise SystemExit(0)

          rows = d.get("技能", [])
          if not isinstance(rows, list) or not all(
              isinstance(r, dict) and isinstance(r.get("技能"), str) and r.get("技能")
              for r in rows
          ):
              print("RED=1")
              print("NEED_HEAL=0")
              print("REASON=公开技能健康返回结构异常，但浅健康已通过；不重启以掩盖未知业务状态")
              raise SystemExit(0)
          failing = [r for r in rows if r.get("退出码") not in (0, None)]
          never = [r for r in rows if (r.get("运行次数") or 0) == 0]
          stale = [r for r in rows
                   if r.get("距今小时") is not None and r["距今小时"] > 30
                   and r.get("运行次数")]
          for r in rows:
              print(f"  {r.get('技能'):<24} rc={r.get('退出码')} 次数={r.get('运行次数')} "
                    f"距今h={r.get('距今小时')} 码={r.get('失败码')}")
          # 业务红色永远要留在心跳结果里，但浅健康通过时，它们全部不可由本
          # 工作流自愈。尤其每日资金的来源/解析/勾稽链由独立云端 worker
          # 负责，重启 Web 应用既不能登录 DWS，也不能生成账户与流水事实对。
          isolated_business = [r for r in failing if r.get("技能") == "daily-funds"]
          print(f"FAILING={len(failing)} NEVER_RAN={len(never)} STALE={len(stale)} "
                f"HEALABLE=0 NO_HEAL={len(failing)} "
                f"ISOLATED_BUSINESS={len(isolated_business)}")
          # RED 与 NEED_HEAL 分家：前者管"这轮心跳红不红"，后者管"要不要动手部署"。
          # 合在一起就只有两种姿势——要么假绿，要么无脑部署，两种都被实测证伪过。
          print("RED=1" if failing else "RED=0")
          print("NEED_HEAL=0")
          if failing:
              print("REASON=业务技能存在失败，但浅健康已通过；不重启以掩盖业务状态：" + "、".join(
                  f"{r.get('技能') or 'UNKNOWN'}({r.get('失败码') or 'UNKNOWN'})"
                  for r in failing))
          else:
              print("REASON=全部技能退出码为 0")
          PY
          grep -E '^(NEED_HEAL|REASON|RED)=' /tmp/beat.txt >> "$GITHUB_OUTPUT"

      # 上一版的冷却判据读 /api/v1/deployments，指望从里面找到本应用最近一次部署时间。
      # 2026-07-28 实测：该端点只返回**进行中**的部署，稳态下恒为空数组（实测 len=0），
      # 于是 newest 永远是 None → 永远 ALLOW=1 → **两小时冷却从上线起一次都没生效过**。
      # 心跳因此每小时无条件部署一次。防抖动写在注释里，实现里是个空转的 if。
      # 改用 Actions 缓存记时间戳：不依赖任何第三方端点的语义，自己记自己的账。
      - name: 取上次自愈时间戳（缓存，不依赖 Coolify 部署历史）
        id: stamp
        if: steps.probe.outputs.NEED_HEAL == '1'
        uses: actions/cache/restore@v4
        with:
          path: /tmp/heal-stamp
          key: kmfa-heal-stamp-${{ github.run_id }}
          restore-keys: kmfa-heal-stamp-

      - name: 距上次自愈是否已满 2 小时（防部署风暴）
        id: cooldown
        if: steps.probe.outputs.NEED_HEAL == '1'
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import datetime, pathlib
          p = pathlib.Path("/tmp/heal-stamp/last.txt")
          raw = p.read_text(encoding="utf-8").strip() if p.exists() else ""
          if not raw:
              # 缓存里没有记录 = 从没自愈过（或缓存被回收）。放行一次，并立刻写下时间戳，
              # 于是最多多打一次部署，不会退化成"每轮都放行"。
              print("ALLOW=1"); print("LAST_HEAL=none"); print("AGE_H=inf")
          else:
              t = datetime.datetime.fromisoformat(raw)
              age = (datetime.datetime.now(datetime.timezone.utc) - t).total_seconds() / 3600
              print(f"LAST_HEAL={raw}")
              print(f"AGE_H={age:.1f}")
              print("ALLOW=1" if age >= 2 else "ALLOW=0")
          PY

      - name: 自愈——触发重新部署（容器冷启动会重跑失败技能）
        if: steps.probe.outputs.NEED_HEAL == '1' && steps.cooldown.outputs.ALLOW == '1'
        env:
          BASE: ${{ secrets.COOLIFY_BASE_URL }}
          TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "判据：${{ steps.probe.outputs.REASON }}"
          echo "上次自愈：${{ steps.cooldown.outputs.LAST_HEAL }}（${{ steps.cooldown.outputs.AGE_H }} 小时前）"
          curl -fsSL -X POST -H "Authorization: Bearer $TOKEN" \
            "$BASE/api/v1/deploy?uuid=96b5df9c-a211-45d4-a7e1-cc264c209d75" | head -c 400
          echo
          echo "已触发重新部署——容器起来后会立刻重跑失败技能"
          mkdir -p /tmp/heal-stamp
          python3 -c "import datetime;print(datetime.datetime.now(datetime.timezone.utc).isoformat())" \
            > /tmp/heal-stamp/last.txt

      # 只在**真的部署了**之后才写缓存——否则冷却会被没动手的轮次续期，
      # 变成"越不动手越不许动手"。
      - name: 记下本次自愈时间戳
        if: steps.probe.outputs.NEED_HEAL == '1' && steps.cooldown.outputs.ALLOW == '1'
        uses: actions/cache/save@v4
        with:
          path: /tmp/heal-stamp
          key: kmfa-heal-stamp-${{ github.run_id }}

      - name: 判定为可自愈但在冷却期内（只记录不动手）
        if: steps.probe.outputs.NEED_HEAL == '1' && steps.cooldown.outputs.ALLOW != '1'
        run: |
          echo "::warning::${{ steps.probe.outputs.REASON }}；但距上次自愈仅 ${{ steps.cooldown.outputs.AGE_H }} 小时，未满 2 小时冷却，本轮不触发部署"

      # 红的判据是 RED（有技能在失败），不是 NEED_HEAL（值不值得部署）。
      # 「修不了所以不部署」绝不等于「没问题」——那正是把红事静音成绿的老路。
      - name: 有失败就让本次运行红（心跳自己不许假绿）
        if: steps.probe.outputs.RED == '1'
        run: |
          echo "::error::${{ steps.probe.outputs.REASON }}"
          exit 1
