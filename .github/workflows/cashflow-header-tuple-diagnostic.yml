name: cashflow-header-tuple-diagnostic

# Temporary branch-only layout diagnostic.  Its only external signal is
# pass/fail coverage of fixed header geometry; it never emits source text,
# image bytes, identifiers, filenames, or monetary values.
on:
  push:
    branches:
      - codex/daily-funds-flow-visual-20260811

permissions:
  contents: read

jobs:
  diagnose:
    name: safe-cashflow-header-tuple
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DAILY_FUNDS_GROUP_ID: ${{ secrets.DAILY_FUNDS_GROUP_ID }}
      DAILY_FUNDS_SENDER_ID: ${{ secrets.DAILY_FUNDS_SENDER_ID }}
      DAILY_FUNDS_GIT_SSH_KEY_B64: ${{ secrets.DAILY_FUNDS_GIT_SSH_KEY_B64 }}
      DAILY_FUNDS_OCR_ENABLED: "1"
      DAILY_FUNDS_OCR_MIN_CONFIDENCE: "0.98"
    steps:
      - uses: actions/checkout@v4

      - name: Build isolated daily-funds parser
        run: docker build -f KMFA/skills/每日资金/Dockerfile -t kmfa-daily-funds:header-tuple-diagnostic .

      - name: Compute source-safe header tuple receipt
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -e DAILY_FUNDS_GROUP_ID \
            -e DAILY_FUNDS_SENDER_ID \
            -e DAILY_FUNDS_GIT_SSH_KEY_B64 \
            -e DAILY_FUNDS_OCR_ENABLED \
            -e DAILY_FUNDS_OCR_MIN_CONFIDENCE \
            -v "${RUNNER_TEMP}:/audit" \
            --entrypoint /bin/sh \
            kmfa-daily-funds:header-tuple-diagnostic -ec '
              python3 -c "import base64; exec(compile(base64.b64decode(\"\"), \"<cashflow-header-tuple-diagnostic>\", \"exec\"))"
            '

      - name: Raw archive is verified
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-header-tuple-safe.json').read_text()); raise SystemExit(not d.get('archive_verified'))"

      - name: Every source has a business-date alias
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-header-tuple-safe.json').read_text()); raise SystemExit(d.get('field_coverage', {}).get('business_date') != d.get('eligible_documents'))"

      - name: Every source has an inflow alias
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-header-tuple-safe.json').read_text()); raise SystemExit(d.get('field_coverage', {}).get('inflow') != d.get('eligible_documents'))"

      - name: Every source has an outflow alias
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-header-tuple-safe.json').read_text()); raise SystemExit(d.get('field_coverage', {}).get('outflow') != d.get('eligible_documents'))"

      - name: Every source has a bank alias
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-header-tuple-safe.json').read_text()); raise SystemExit(d.get('field_coverage', {}).get('bank') != d.get('eligible_documents'))"

      - name: Every source has an ordered four-field candidate
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-header-tuple-safe.json').read_text()); raise SystemExit(d.get('ordered_any_documents') != d.get('eligible_documents'))"

      - name: Every source places the ordered candidate in the top fifth
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-header-tuple-safe.json').read_text()); raise SystemExit(d.get('ordered_top_fifth_documents') != d.get('eligible_documents'))"

      - name: All source header tuples fit sixteen pixels
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-header-tuple-safe.json').read_text()); raise SystemExit(d.get('spread_coverage', {}).get('16') != d.get('eligible_documents'))"

      - name: All source header tuples fit thirty-two pixels
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-header-tuple-safe.json').read_text()); raise SystemExit(d.get('spread_coverage', {}).get('32') != d.get('eligible_documents'))"

      - name: All source header tuples fit forty-eight pixels
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-header-tuple-safe.json').read_text()); raise SystemExit(d.get('spread_coverage', {}).get('48') != d.get('eligible_documents'))"

      - name: All source header tuples fit sixty-four pixels
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-header-tuple-safe.json').read_text()); raise SystemExit(d.get('spread_coverage', {}).get('64') != d.get('eligible_documents'))"

      - name: All source header tuples fit ninety-six pixels
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-header-tuple-safe.json').read_text()); raise SystemExit(d.get('spread_coverage', {}).get('96') != d.get('eligible_documents'))"

      - name: All source header tuples fit one-hundred-twenty-eight pixels
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-header-tuple-safe.json').read_text()); raise SystemExit(d.get('spread_coverage', {}).get('128') != d.get('eligible_documents'))"

      - name: All source header tuples fit one-hundred-ninety-two pixels
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-header-tuple-safe.json').read_text()); raise SystemExit(d.get('spread_coverage', {}).get('192') != d.get('eligible_documents'))"

      - name: All source header tuples fit two-hundred-fifty-six pixels
        if: always()
        continue-on-error: true
        run: python3 -c "import json; from pathlib import Path; d=json.loads(Path('${RUNNER_TEMP}/cashflow-header-tuple-safe.json').read_text()); raise SystemExit(d.get('spread_coverage', {}).get('256') != d.get('eligible_documents'))"
