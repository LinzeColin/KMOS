# 部署溯源查询：给定 Coolify deployment_uuid，回显四个非秘密字段
# （source_commit / image_id_or_digest / deployment_uuid / completed_at）。
#
# 为什么存在：镜像摘要与 Coolify 侧完成时刻只有部署平台知道，而令牌永不经人手。
# 本 workflow 用仓库 secrets 在 Actions 内查询，**只打印上述字段**——
# 原始响应与构建日志绝不落公开日志（构建日志可能回显 build args）。
name: coolify-deployment-info

on:
  workflow_dispatch:
    inputs:
      deployment_uuid:
        description: "Coolify deployment uuid"
        required: true
        type: string
      diagnostic:
        description: "只输出脱敏失败类别，不输出原始构建日志"
        required: false
        default: false
        type: boolean
      application_uuid:
        description: "可选的 Coolify application uuid；仅诊断资源目录与 Compose 接线"
        required: false
        default: ""
        type: string

jobs:
  info:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.actor == 'LinzeColin'
    steps:
      - name: 查询并提取非秘密字段
        env:
          BASE: ${{ secrets.COOLIFY_BASE_URL }}
          TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          UUID: ${{ inputs.deployment_uuid }}
          DIAGNOSTIC: ${{ inputs.diagnostic }}
          APPLICATION_UUID: ${{ inputs.application_uuid }}
        run: |
          set -euo pipefail
          # 响应含全量构建日志（数 MB）：环境变量会撞 execve 上限（二跑实测 Argument list
          # too long）、heredoc 会抢占 stdin（首跑实测）——落临时文件再读，文件绝不打印。
          curl -fsSL -H "Authorization: Bearer $TOKEN" "$BASE/api/v1/deployments/$UUID" -o "$RUNNER_TEMP/resp.json"
          # The deployment record carries the opaque resource UUID.  Diagnostic
          # mode may read the resource configuration only to classify its base
          # directory and compose-file wiring; it never prints raw configuration.
          if [ "${DIAGNOSTIC:-false}" = "true" ]; then
            APP_UUID="${APPLICATION_UUID:-}"
            if [ -z "$APP_UUID" ]; then
              APP_UUID="$(python3 - <<'PY'
          import json
          import os
          d = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "resp.json"), encoding="utf-8"))
          if isinstance(d, dict) and "deployments" in d:
              arr = d.get("deployments") or [{}]
              d = arr[0] if arr else {}
          print(d.get("resource_uuid") or d.get("application_uuid") or "")
          PY
              )"
            fi
            if [ -n "$APP_UUID" ]; then
              curl -fsSL -H "Authorization: Bearer $TOKEN" \
                "$BASE/api/v1/applications/$APP_UUID" -o "$RUNNER_TEMP/application.json" || true
              # Coolify versions differ on the single-resource endpoint.  The
              # supported collection endpoint is a read-only fallback.
              curl -fsSL -H "Authorization: Bearer $TOKEN" \
                "$BASE/api/v1/applications" -o "$RUNNER_TEMP/applications.json" || true
            fi
          fi
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import re
          d = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "resp.json"), encoding="utf-8"))
          # 兼容 {deployments:[...]} 与直接对象两种返回形状
          if isinstance(d, dict) and "deployments" in d:
              arr = d.get("deployments") or [{}]
              d = arr[0] if arr else {}
          raw = json.dumps(d, ensure_ascii=False)
          # 镜像摘要：只从整响应文本正则提取 sha256，优先取「writing image」邻域
          digests = re.findall(r"writing image[^\n\"]*?(sha256:[0-9a-f]{64})", raw)
          if not digests:
              digests = re.findall(r"(sha256:[0-9a-f]{64})", raw)
          completed = d.get("finished_at") or d.get("updated_at") or ""
          print("source_commit=" + str(d.get("commit") or ""))
          print("image_id_or_digest=" + (digests[-1] if digests else "未在响应中找到 sha256（构建日志可能未含 writing image 行）"))
          deployment_uuid = str(d.get("deployment_uuid") or d.get("uuid") or "")
          diagnostic = os.environ.get("DIAGNOSTIC", "false").lower() == "true"
          print("deployment_uuid=" + ("present" if diagnostic and deployment_uuid else deployment_uuid))
          print("completed_at=" + str(completed) + "  status=" + str(d.get("status") or ""))
          if diagnostic:
              # The Coolify response can include complete build logs.  Never emit
              # them: classify a small, explicit set of failure signatures only.
              # This makes failure triage useful without turning Actions logs into
              # a second storage location for credentials or private inputs.
              normalized = re.sub(r"\s+", " ", raw).lower()
              signatures = (
                  ("DISK_CAPACITY", r"no space left on device|disk quota exceeded|insufficient disk|not enough space"),
                  ("DOCKER_CONTEXT_OR_PATH", r"failed to read dockerfile|failed to calculate checksum|copy failed|lstat .* no such file|file not found in build context"),
                  ("COMPOSE_SCHEMA", r"compose.*(invalid|unsupported|must be)|services\..*(invalid|must be)|validating .*compose"),
                  ("REGISTRY_OR_NETWORK", r"failed to resolve source metadata|tls handshake timeout|network is unreachable|connection refused|i/o timeout|too many requests"),
                  ("IMAGE_BUILD_COMMAND", r"failed to solve|error building|process .* did not complete successfully|executor failed running"),
                  ("CONTAINER_NAME_CONFLICT", r"container name .* is already in use|conflict.*container name|name is already in use"),
                  ("CONTAINER_START_OR_HEALTH", r"unhealthy|healthcheck|container .* exited|exit code [1-9]|could not start container"),
                  ("PLATFORM_ORCHESTRATION", r"deployment failed|internal server error|could not deploy|deployment error"),
              )
              matches = [name for name, pattern in signatures if re.search(pattern, normalized)]
              failure_class = matches[0] if matches else "UNCLASSIFIED"
              context_signatures = (
                  ("CONTEXT_OUTSIDE_ALLOWED_ROOT", r"outside the build context|forbidden path outside"),
                  ("DOCKERFILE_PATH_MISSING", r"failed to read dockerfile|dockerfile .* (not found|no such file)"),
                  ("COPY_SOURCE_MISSING", r"failed to calculate checksum|copy failed|lstat .* no such file"),
                  ("BUILD_CONTEXT_PATH_MISSING", r"build context.*(does not exist|not found)|unable to prepare context"),
              )
              context_matches = [
                  name
                  for name, pattern in context_signatures
                  if re.search(pattern, normalized)
              ]
              context_detail_class = (
                  context_matches[0]
                  if context_matches
                  else "NONE_OR_NOT_APPLICABLE"
              )
              # A fingerprint permits comparing a repeated platform failure while
              # disclosing neither the failing line nor any surrounding log text.
              markers = "|".join(matches + context_matches) or "UNCLASSIFIED"
              fingerprint = hashlib.sha256((str(d.get("status") or "") + "|" + markers).encode()).hexdigest()[:16]
              print("diagnostic_enabled=true")
              print("failure_class=" + failure_class)
              print("failure_marker_count=" + str(len(matches)))
              print("context_detail_class=" + context_detail_class)
              print("context_detail_marker_count=" + str(len(context_matches)))
              print("failure_fingerprint=" + fingerprint)
              app_path = os.path.join(os.environ["RUNNER_TEMP"], "application.json")
              apps_path = os.path.join(os.environ["RUNNER_TEMP"], "applications.json")
              app = {}
              app_origin = "UNAVAILABLE"
              target_resource_uuid = str(
                  os.environ.get("APPLICATION_UUID")
                  or d.get("resource_uuid")
                  or d.get("application_uuid")
                  or ""
              )
              try:
                  if os.path.exists(app_path):
                      app = json.load(open(app_path, encoding="utf-8"))
                      if isinstance(app, dict) and isinstance(app.get("data"), dict):
                          app = app["data"]
                      if (
                          isinstance(app, dict)
                          and target_resource_uuid
                          and str(app.get("uuid") or "") == target_resource_uuid
                      ):
                          app_origin = "DIRECT_ENDPOINT"
                      else:
                          app = {}
              except Exception:
                  app = {}
              if not app and target_resource_uuid and os.path.exists(apps_path):
                  try:
                      apps = json.load(open(apps_path, encoding="utf-8"))
                      if isinstance(apps, dict):
                          apps = apps.get("data") or apps.get("applications") or []
                      if isinstance(apps, list):
                          app = next(
                              (
                                  item
                                  for item in apps
                                  if isinstance(item, dict)
                                  and str(item.get("uuid") or "") == target_resource_uuid
                              ),
                              {},
                          )
                          if app:
                              app_origin = "APPLICATION_LIST"
                  except Exception:
                      app = {}
              if not isinstance(app, dict):
                  app = {}
              base = str(app.get("base_directory") or "").strip()
              compose_location = str(app.get("docker_compose_location") or "").strip()
              base_normalized = base.strip("/")
              compose_normalized = compose_location.strip("/")
              if not app:
                  base_class = "UNAVAILABLE"
                  compose_class = "UNAVAILABLE"
                  source_class = "UNAVAILABLE"
              else:
                  base_class = (
                      "REPOSITORY_ROOT"
                      if base_normalized in ("", ".")
                      else "COMPOSE_DIRECTORY"
                      if base_normalized == "KMFA/deploy/coolify"
                      else "OTHER_SUBPATH"
                  )
                  compose_class = (
                      "EXPECTED_COMPOSE_PATH"
                      if compose_normalized == "KMFA/deploy/coolify/docker-compose.yml"
                      else "OTHER_COMPOSE_PATH"
                      if compose_normalized
                      else "UNSET"
                  )
                  source_class = (
                      "INLINE_COMPOSE"
                      if app.get("docker_compose_raw")
                      else "GIT_COMPOSE_FILE"
                  )
              print("resource_base_directory_class=" + base_class)
              print("resource_compose_location_class=" + compose_class)
              print("resource_compose_source_class=" + source_class)
              print(
                  "resource_identifier_class="
                  + ("PRESENT" if target_resource_uuid else "MISSING")
              )
              print("resource_config_origin=" + app_origin)
              compose_raw = str(app.get("docker_compose_raw") or "")
              expected_dockerfiles = (
                  ("KMFA/skills/每日资金/Dockerfile", 1),
                  ("KMFA/deploy/skills-runtime/Dockerfile", 1),
                  ("KMFA/app/backend/Dockerfile", 2),
              )
              repository_root_context_count = len(
                  re.findall(
                      r"(?m)^\s*context:\s*[\"']?\.[\"']?\s*(?:#.*)?$",
                      compose_raw,
                  )
              )
              legacy_parent_context_count = len(
                  re.findall(
                      r"(?m)^\s*context:\s*[\"']?\.\./\.\./\.\./?[\"']?\s*$",
                      compose_raw,
                  )
              )
              dockerfile_count = sum(
                  min(compose_raw.count(path), expected_count)
                  for path, expected_count in expected_dockerfiles
              )
              if not compose_raw:
                  compose_contract_class = "UNAVAILABLE"
              elif (
                  repository_root_context_count >= 4
                  and dockerfile_count
                  >= sum(expected_count for _, expected_count in expected_dockerfiles)
              ):
                  compose_contract_class = "REPOSITORY_ROOT_CONTEXT_AND_DOCKERFILES_MATCH"
              elif (
                  legacy_parent_context_count >= 4
                  and dockerfile_count
                  >= sum(expected_count for _, expected_count in expected_dockerfiles)
              ):
                  compose_contract_class = "LEGACY_PARENT_CONTEXT_AND_DOCKERFILES_MATCH"
              else:
                  compose_contract_class = "COMPOSE_BUILD_CONTRACT_DRIFT"
              print("resource_compose_build_contract=" + compose_contract_class)
              print(
                  "resource_compose_repository_root_context_count="
                  + str(repository_root_context_count)
              )
              print(
                  "resource_compose_legacy_parent_context_count="
                  + str(legacy_parent_context_count)
              )
              print("resource_compose_dockerfile_path_count=" + str(dockerfile_count))
              deployment_log_text = json.dumps(
                  d.get("logs") or d.get("output") or "",
                  ensure_ascii=False,
              ).lower()
              failure_windows = []
              for match in re.finditer(
                  r"failed to read dockerfile|dockerfile .* (not found|no such file)",
                  deployment_log_text,
              ):
                  failure_windows.append(
                      deployment_log_text[
                          max(0, match.start() - 1200) : match.end() + 1200
                      ]
                  )
              target_markers = (
                  ("DAILY_FUNDS", ("daily-funds", "每日资金")),
                  ("SKILLS", ("kmfa-skills", "skills-runtime")),
                  ("APP", ("kmfa-app", "app/backend")),
                  ("LIFECYCLE_WORKER", ("lifecycle-worker",)),
              )
              target_matches = [
                  name
                  for name, markers in target_markers
                  if any(
                      marker in window
                      for window in failure_windows
                      for marker in markers
                  )
              ]
              dockerfile_failure_service = (
                  target_matches[0]
                  if len(target_matches) == 1
                  else "MULTIPLE_OR_AMBIGUOUS"
                  if target_matches
                  else "UNCLASSIFIED"
              )
              print(
                  "dockerfile_failure_service_class="
                  + dockerfile_failure_service
              )
              # Container and application logs may contain private runtime
              # context.  Keep the diagnostic strictly categorical: inspect
              # only bounded neighbouring lines and emit no line, value, ID,
              # filename, environment key, or exception text.
              log_lines = deployment_log_text.splitlines()
              components = (
                  ("APP", ("kmfa-app", "app/backend")),
                  ("DAILY_FUNDS", ("kmfa-daily-funds", "daily-funds")),
                  ("SKILLS", ("kmfa-skills", "skills-runtime")),
                  ("LIFECYCLE_WORKER", ("kmfa-lifecycle-worker", "lifecycle-worker")),
              )
              boot_signatures = (
                  ("UNHEALTHY", r"unhealthy|healthcheck"),
                  ("EXITED", r"container .* exited|exited .*code|exit code [1-9]"),
                  ("IMPORT", r"modulenotfounderror|importerror|failed to import|could not import"),
                  ("PORT", r"address already in use|bind.*port|connection refused"),
                  ("CONTAINER_NAME_CONFLICT", r"container name .* is already in use|conflict.*container name|name is already in use"),
                  ("STATE", r"schema.*(version|mismatch)|structured.*store|object.*storage"),
                  ("PERMISSION", r"permission denied|read-only file system"),
              )
              component_failures = []
              for component, markers in components:
                  nearby = []
                  for idx, line in enumerate(log_lines):
                      if any(marker in line for marker in markers):
                          nearby.append(
                              "\n".join(
                                  log_lines[max(0, idx - 3) : min(len(log_lines), idx + 8)]
                              )
                          )
                  matched = [
                      name
                      for name, pattern in boot_signatures
                      if any(re.search(pattern, window) for window in nearby)
                  ]
                  if matched:
                      component_failures.append(component + "_" + matched[0])
              component_failure_class = (
                  component_failures[0]
                  if len(component_failures) == 1
                  else "MULTIPLE_OR_AMBIGUOUS"
                  if component_failures
                  else "NONE_OR_UNCLASSIFIED"
              )
              print("runtime_component_failure_class=" + component_failure_class)
              proxy_class = (
                  "PROXY_OR_ROUTING_SIGNAL"
                  if re.search(r"traefik|router.*(error|fail)|bad gateway|service unavailable", deployment_log_text)
                  else "NONE_OR_UNCLASSIFIED"
              )
              print("runtime_proxy_signal_class=" + proxy_class)
          PY
