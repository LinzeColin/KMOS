# KMFA App（DT6）。上线经 Cloudflare Tunnel + Access（PROD.0020/0021），实例零开放端口。
services:
  app:
    build:
      context: ../..
      dockerfile: KMFA/app/backend/Dockerfile
    container_name: kmfa-app
    restart: always
    environment:
      KMFA_PUBLIC_SHELL_ENABLED: "${KMFA_PUBLIC_SHELL_ENABLED:-1}"
      KMFA_PUBLIC_INDEXING_ENABLED: "${KMFA_PUBLIC_INDEXING_ENABLED:-0}"
      KMFA_WALKING_SKELETON_ENABLED: "${KMFA_WALKING_SKELETON_ENABLED:-0}"
      # P5.3 快速回滚只暂停新上传；既有读/恢复与 reconciliation 保持可用。
      KMFA_CONSISTENCY_STATE_MODE: "${KMFA_CONSISTENCY_STATE_MODE:-recoverable-v1}"
      # S05 expand/contract：默认继续读 v1.5 SQLite；只有显式配置完整 DSN 才切共享 PG。
      KMFA_STRUCTURED_DATABASE_MODE: "${KMFA_STRUCTURED_DATABASE_MODE:-legacy-sqlite}"
      KMFA_STRUCTURED_DATABASE_URL: "${KMFA_STRUCTURED_DATABASE_URL:-}"
      # P5.2 对象层同样 opt-in；默认继续写旧卷，但始终保留旧对象 read path。
      KMFA_ARTIFACT_STORAGE_MODE: "${KMFA_ARTIFACT_STORAGE_MODE:-legacy-filesystem}"
      KMFA_S3_ENDPOINT_URL: "${KMFA_S3_ENDPOINT_URL:-}"
      KMFA_S3_BUCKET: "${KMFA_S3_BUCKET:-}"
      KMFA_S3_REGION: "${KMFA_S3_REGION:-auto}"
      KMFA_S3_PREFIX: "${KMFA_S3_PREFIX:-kmfa/private/v1}"
      KMFA_S3_ACCESS_KEY_ID: "${KMFA_S3_ACCESS_KEY_ID:-}"
      KMFA_S3_SECRET_ACCESS_KEY: "${KMFA_S3_SECRET_ACCESS_KEY:-}"
      KMFA_S3_ADDRESSING_STYLE: "${KMFA_S3_ADDRESSING_STYLE:-path}"
      # 只供本 compose 的 object-store 私网；公网/生产 endpoint 必须 HTTPS。
      KMFA_S3_ALLOW_INSECURE_LOCAL: "${KMFA_S3_ALLOW_INSECURE_LOCAL:-0}"
      KMFA_ABUSE_POLICY_MODE: "${KMFA_ABUSE_POLICY_MODE:-enforced}"
      KMFA_PRIVATE_OPS_REQUIRE_ACCESS: "${KMFA_PRIVATE_OPS_REQUIRE_ACCESS:-1}"
      KMFA_CLOUDFLARE_ACCESS_TEAM_DOMAIN: "${KMFA_CLOUDFLARE_ACCESS_TEAM_DOMAIN:-}"
      KMFA_CLOUDFLARE_ACCESS_AUD: "${KMFA_CLOUDFLARE_ACCESS_AUD:-}"
    volumes:
      # P3.4 早期骨架的 SQLite 与私有文件 adapter 共用耐久卷；Flag 回滚不得删卷。
      - kmfa-app-state:/var/lib/kmfa/state
    ports:
      - "127.0.0.1:8000:8000"              # 仅本机回环，出网走 cloudflared
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request;from pathlib import Path;from app.object_storage import configured_write_store;from app.structured_store import open_structured_store;p=Path('/var/lib/kmfa/state/walking-skeleton');s=open_structured_store(p/'walking_skeleton.sqlite3');assert s.schema_version()==3;s.close();o=configured_write_store(p);o.ensure_ready();urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 2m
      timeout: 10s

  structured-db:
    profiles: ["postgresql"]
    image: postgres:17.10-alpine3.23
    container_name: kmfa-structured-db
    restart: always
    environment:
      POSTGRES_DB: "${KMFA_POSTGRES_DB:-kmfa}"
      POSTGRES_USER: "${KMFA_POSTGRES_USER:-kmfa}"
      # 启动 postgresql profile 前必须显式设置；空值会由官方镜像 fail closed。
      POSTGRES_PASSWORD: "${KMFA_POSTGRES_PASSWORD:-}"
    volumes:
      - kmfa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  object-store:
    profiles: ["s3"]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: kmfa-object-store
    restart: always
    environment:
      MINIO_ROOT_USER: "${KMFA_MINIO_ROOT_USER:-}"
      MINIO_ROOT_PASSWORD: "${KMFA_MINIO_ROOT_PASSWORD:-}"
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      : "$${MINIO_ROOT_USER:?KMFA_MINIO_ROOT_USER is required}"
      : "$${MINIO_ROOT_PASSWORD:?KMFA_MINIO_ROOT_PASSWORD is required}"
      exec minio server /data --console-address ":9001"
    volumes:
      - kmfa-object-data:/data
    expose:
      - "9000"
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "http://127.0.0.1:9000/minio/health/ready",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  object-store-bootstrap:
    profiles: ["s3"]
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: kmfa-object-store-bootstrap
    restart: "no"
    depends_on:
      object-store:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: "${KMFA_MINIO_ROOT_USER:-}"
      MINIO_ROOT_PASSWORD: "${KMFA_MINIO_ROOT_PASSWORD:-}"
      KMFA_S3_BUCKET: "${KMFA_S3_BUCKET:-}"
      KMFA_S3_PREFIX: "${KMFA_S3_PREFIX:-kmfa/private/v1}"
      KMFA_S3_ACCESS_KEY_ID: "${KMFA_S3_ACCESS_KEY_ID:-}"
      KMFA_S3_SECRET_ACCESS_KEY: "${KMFA_S3_SECRET_ACCESS_KEY:-}"
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      : "$${MINIO_ROOT_USER:?KMFA_MINIO_ROOT_USER is required}"
      : "$${MINIO_ROOT_PASSWORD:?KMFA_MINIO_ROOT_PASSWORD is required}"
      : "$${KMFA_S3_ACCESS_KEY_ID:?KMFA_S3_ACCESS_KEY_ID is required}"
      : "$${KMFA_S3_SECRET_ACCESS_KEY:?KMFA_S3_SECRET_ACCESS_KEY is required}"
      test "$${MINIO_ROOT_USER}" != "$${KMFA_S3_ACCESS_KEY_ID}"
      test "$${MINIO_ROOT_PASSWORD}" != "$${KMFA_S3_SECRET_ACCESS_KEY}"
      test "$${KMFA_S3_BUCKET}" = "kmfa-private-artifacts"
      test "$${KMFA_S3_PREFIX}" = "kmfa/private/v1"
      mc alias set local http://object-store:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
      mc mb --ignore-existing "local/$${KMFA_S3_BUCKET}"
      mc anonymous set none "local/$${KMFA_S3_BUCKET}"
      mc version enable "local/$${KMFA_S3_BUCKET}"
      mc admin user add local "$${KMFA_S3_ACCESS_KEY_ID}" "$${KMFA_S3_SECRET_ACCESS_KEY}"
      mc admin policy create local kmfa-private-artifacts /policy/object-store-policy.json
      mc admin policy attach local kmfa-private-artifacts --user "$${KMFA_S3_ACCESS_KEY_ID}"
    volumes:
      - ./object-store-policy.json:/policy/object-store-policy.json:ro

volumes:
  kmfa-app-state:
  # P5.1 只建立共享结构化存储；备份/恢复演练由 P5.4 Gate 后才可宣称完成。
  kmfa-postgres-data:
  # P5.2 对象卷与旧 app-state 卷都必须保留；普通 rollback 禁止 down -v。
  kmfa-object-data:
