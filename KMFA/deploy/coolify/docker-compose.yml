# KMFA 统一云端部署（Coolify 资源）——单一治理平面。
#
# 治理原则（Owner 2026-07-18）：统一治理、降复杂度、不加第四件——
#   Coolify = 唯一部署/编排面板，Cloudflare = DNS/边缘 TLS，OVH = 主机；不引入独立 bootstrap/Tunnel。
#
# 用法：Coolify → New Resource → Docker Compose → 指向本仓 `KMFA/deploy/coolify/docker-compose.yml`。
#   · env/secrets 在 Coolify 面板设（键位见同目录 `.env.example`；`KMFA_DELIVERY_ENABLED` 初始 0）。
#   · 域名在 Coolify 给 app 服务设 `kmfa.linzezhang.com`（Coolify Traefik + Cloudflare 代理）。
#
# 分批（3.7GB 容量 Gate）：默认只起 skills（app 在 `full` profile 后置）；观测内存无碍后再启 app。
#
# 自包含镜像：Coolify 以仓根传入 `--project-directory`，故 build.context 必须为
# `.`（不是相对本文件的 `../../..`）；Dockerfile 用 `COPY . /opt/kmfa/KMOS`
# 把代码烧进镜像。本机排障须复用同一调用：`docker compose --project-directory <仓根> -f <compose文件> ...`。
#   **不挂宿主仓**——真 Coolify 上 `./` 运行时挂载只含 compose、无代码（DT9 主机核验坐实），故弃之。
#   代码随每次 push 重 build 更新。本机验证：build 后 `docker run`（不挂任何卷）跑 self-audit 应 rc=0。

services:
  daily-funds:
    # 完全独立的纵向切片：不依赖 skills/app 的启动顺序，也不共享现有 DWS profile、
    # keyring、台账或本机状态。唯一给 app 的是已验证 projection（只读）。
    build:
      # Coolify resolves this from --project-directory=<仓根>; all Dockerfiles
      # COPY KMFA/... from that same repository root.
      context: .
      dockerfile: KMFA/skills/每日资金/Dockerfile
    image: kmfa-daily-funds:coolify
    container_name: kmfa-daily-funds
    restart: always
    environment:
      TZ: Asia/Shanghai
      DAILY_FUNDS_STATE_DIR: "/var/lib/kmfa/daily-funds-state"
      DAILY_FUNDS_PUBLICATION_DIR: "/var/lib/kmfa/daily-funds-publication"
      DAILY_FUNDS_CONTROL_DIR: "/var/lib/kmfa/daily-funds-control"
      DAILY_FUNDS_DWS_CONFIG_DIR: "/var/lib/kmfa/daily-funds-dws/config"
      DAILY_FUNDS_DWS_KEYRING_DIR: "/var/lib/kmfa/daily-funds-dws/keyring"
      DAILY_FUNDS_PRIVATE_REPO: "${DAILY_FUNDS_PRIVATE_REPO:-git@github.com:LinzeColin/Private-Database.git}"
      DAILY_FUNDS_PRIVATE_BRANCH: "${DAILY_FUNDS_PRIVATE_BRANCH:-main}"
      DAILY_FUNDS_GROUP_ID: "${DAILY_FUNDS_GROUP_ID:-}"
      DAILY_FUNDS_SENDER_ID: "${DAILY_FUNDS_SENDER_ID:-}"
      DAILY_FUNDS_DWS_CLIENT_ID: "${DAILY_FUNDS_DWS_CLIENT_ID:-}"
      DAILY_FUNDS_DWS_AUTH_BUNDLE_B64: "${DAILY_FUNDS_DWS_AUTH_BUNDLE_B64:-}"
      DAILY_FUNDS_GIT_SSH_KEY_B64: "${DAILY_FUNDS_GIT_SSH_KEY_B64:-}"
      DAILY_FUNDS_CLOUDFLARE_API_TOKEN: "${DAILY_FUNDS_CLOUDFLARE_API_TOKEN:-}"
      DAILY_FUNDS_CF_ACCOUNT_ID: "${DAILY_FUNDS_CF_ACCOUNT_ID:-}"
      DAILY_FUNDS_D1_DATABASE_ID: "${DAILY_FUNDS_D1_DATABASE_ID:-}"
      # Monthly restore drill must target a separate non-production D1; the
      # worker rejects an empty value or the live database ID.
      DAILY_FUNDS_RESTORE_DRILL_D1_DATABASE_ID: "${DAILY_FUNDS_RESTORE_DRILL_D1_DATABASE_ID:-}"
      DAILY_FUNDS_R2_ENDPOINT_URL: "${DAILY_FUNDS_R2_ENDPOINT_URL:-}"
      DAILY_FUNDS_R2_BUCKET: "${DAILY_FUNDS_R2_BUCKET:-}"
      DAILY_FUNDS_R2_ACCESS_KEY_ID: "${DAILY_FUNDS_R2_ACCESS_KEY_ID:-}"
      DAILY_FUNDS_R2_SECRET_ACCESS_KEY: "${DAILY_FUNDS_R2_SECRET_ACCESS_KEY:-}"
      DAILY_FUNDS_OCI_ENDPOINT_URL: "${DAILY_FUNDS_OCI_ENDPOINT_URL:-}"
      DAILY_FUNDS_OCI_BUCKET: "${DAILY_FUNDS_OCI_BUCKET:-}"
      DAILY_FUNDS_OCI_ACCESS_KEY_ID: "${DAILY_FUNDS_OCI_ACCESS_KEY_ID:-}"
      DAILY_FUNDS_OCI_SECRET_ACCESS_KEY: "${DAILY_FUNDS_OCI_SECRET_ACCESS_KEY:-}"
      DAILY_FUNDS_OCI_REGION: "${DAILY_FUNDS_OCI_REGION:-ap-chuncheon-1}"
      DAILY_FUNDS_OCI_PAR_URL: "${DAILY_FUNDS_OCI_PAR_URL:-}"
    volumes:
      - kmfa-daily-funds-state:/var/lib/kmfa/daily-funds-state
      - kmfa-daily-funds-dws:/var/lib/kmfa/daily-funds-dws
      - kmfa-daily-funds-publication:/var/lib/kmfa/daily-funds-publication
      - kmfa-daily-funds-control:/var/lib/kmfa/daily-funds-control
    healthcheck:
      # Liveness only.  Missing production credentials must surface in the
      # protected UI as "需处理", never be disguised as source readiness.
      test: ["CMD", "/opt/daily-funds/healthcheck.sh"]
      interval: 2m
      timeout: 15s
      start_period: 45s
      retries: 3

  skills:
    build:
      context: .                              # 仓根（Coolify --project-directory）
      dockerfile: KMFA/deploy/skills-runtime/Dockerfile   # 复用 #109 Dockerfile，内 COPY . 烧代码进镜像
    image: kmfa-skills:coolify
    container_name: kmfa-skills
    restart: always
    environment:
      # 业务锚北京时间——entrypoint 有 +0800 守卫，切勿覆盖为他时区（否则 cron 按错钟评估排程）
      TZ: Asia/Shanghai
      # 考勤投递回执必须落在 **app 也能读到的卷** 上。
      # 原默认 `/var/lib/kmfa/attendance` 是纯容器内路径：没挂卷，容器重建即丢，
      # 且 app 永远读不到——「考勤到底发出去没有」于是无从查证，只能等 Owner 说
      # 「我没收到」。kmfa-logs 是 skills 读写、app 只读的既有共享卷
      # （KMFA_ATTENDANCE_RUNTIME_DIR 已经这么用），直接复用，不新增卷和挂载。
      KMFA_ATTENDANCE_ARCHIVE_ROOT: "/var/log/kmfa/dingtalk_attendance"
      # 双跑纪律：默认 0 只 dry-run；比对通过 + Owner 同意后于 Coolify 面板置 1
      KMFA_DELIVERY_ENABLED: "${KMFA_DELIVERY_ENABLED:-0}"
      # 考勤 dws 双闸之一：dws 登录 + browser-policy 完成后于 Coolify 置 1
      KMFA_DINGTALK_ATTENDANCE_ALLOW_DWS_COMMANDS: "${KMFA_DINGTALK_ATTENDANCE_ALLOW_DWS_COMMANDS:-0}"
      DINGTALK_ROBOT_URL: "${DINGTALK_ROBOT_URL:-}"
      DINGTALK_ROBOT_SIGNING_KEY: "${DINGTALK_ROBOT_SIGNING_KEY:-}"
      DINGTALK_DING_ROBOT_CODE: "${DINGTALK_DING_ROBOT_CODE:-}"
      KMFA_ALERT_WEBHOOK_TOKEN: "${KMFA_ALERT_WEBHOOK_TOKEN:-}"
      # App 状态面异地备份凭据（优先部署密钥，其次 token；都空则降级写命名卷）。
      # 首选：部署密钥私钥的 **base64 单行**（对唯一私有库 Private-Database 可写）。
      #   agent 已生成密钥、把公钥装为该库可写部署密钥；base64 私钥在 Owner
      #   _protected/kmfa_backup_deploy_key.b64——粘进此项即可（entrypoint 启动时解到 600 文件、
      #   只把路径给 cron，密钥本体不落 cron.d/日志）。每日 00:30 北京自动异地备份。
      KMFA_BACKUP_SSH_KEY_B64: "${KMFA_BACKUP_SSH_KEY_B64:-}"
      # 备选：对 Private-Database 有 contents:write 的 GitHub token（REST 路径）。
      # 注意：2026-07-27 实测这一项在 Coolify 面板里**存了两份**，空的那份赢了，
      # 于是容器内取到空值、台账回传断了几十次无人察觉。工具已改为 token 缺失时
      # 回落到上面那把部署密钥（project-cost-refresh 用它、一直好用），不再单点依赖。
      KMFA_BACKUP_GH_TOKEN: "${KMFA_BACKUP_GH_TOKEN:-}"
      # 项目成本正式刷新只读 Private-Database 的专用 token。运行时通过
      # private_db_client 按 manifest 精确取文件，禁止回退为 git clone 全库。
      KMFA_PRIVATE_DB_READ_TOKEN: "${KMFA_PRIVATE_DB_READ_TOKEN:-}"
      # 加密工资表密码。只进 Coolify secret；不进入命令参数、日志、代码或制品。
      KMFA_PAYROLL_PASSWORD: "${KMFA_PAYROLL_PASSWORD:-}"
      # 考勤投递对象。测试期只发张霖泽本人（Owner 令：不许发群，除非授权）。
      # 这一项曾只加进 entrypoint 的合成清单却漏在 compose 里——变量于是从没到过容器，
      # 靠 run_skill.sh 的默认值 personal 兜住。默认值恰好是安全值，但那是运气不是设计。
      KMFA_NOTIFICATION_TARGETS: "${KMFA_NOTIFICATION_TARGETS:-personal}"
      # 压测节拍的总闸。**同一个坑在这个文件里第二次出现**：2026-07-28 压测把线上
      # 打下线时，我在 Coolify 置了 KMFA_BOOT_SWEEP=0 当急停——而它没在这里声明，
      # 于是根本没进容器。Compose 的语义是：shell 里的变量只能用于 ${} 插值，
      # 不列在 environment 下就不会传进容器。那晚站点稳下来是别的原因（冷却闸），
      # 不是我以为的这个开关。**一个不管用的急停比没有更糟**——真出事时会去按它。
      # 门禁见 KMFA/tests/test_env_switches_reach_the_container.py：
      # entrypoint / run_skill.sh 读的每个开关，都必须在这里声明。
      KMFA_BOOT_SWEEP: "${KMFA_BOOT_SWEEP:-1}"
      # 日常检查的输入 zip 覆盖。空 = 从上游归档目录里 find 最新的一份。
      # 这一项是上面那道门禁**当场抓到的第三例**——我在 #273 加了它却同样漏了声明，
      # 想用它指定输入也会是按了没反应。
      KMFA_DAILY_INPUT_ZIP: "${KMFA_DAILY_INPUT_ZIP:-}"
      # 考勤私有运行时**必须落持久卷**。默认路径在镜像层里，每次部署被重置——
      # 而派发要读的 notification_targets_resolved.json 就在这里。
      # 它一直不存在，派发就一直 NOTIFIER_CONFIG_MISSING → rc=5。
      # 这正是「考勤修一个月没修好」的根因（2026-07-27 靠失败码定位）。
      KMFA_ATTENDANCE_RUNTIME_DIR: "/var/log/kmfa/attendance-runtime"
    volumes:
      # 代码已烧进镜像（自包含），不挂宿主仓
      - kmfa-dws-auth:/root/.dws                  # dws 登录态持久（实例内加密存储）
      - kmfa-dws-keyring:/root/.local/share/dws-cli
      - kmfa-logs:/var/log/kmfa                   # 台账/日志持久
      # 只读挂 app 状态卷：daily-backup 要读 SQLite/JSONL 打包异地备份（只读，绝不写）。
      - kmfa-app-state:/var/lib/kmfa/state:ro
      # DWS 上游归档输出（钉钉拉回的文件先落这里，再回传 GitHub 私有库）。可写。
      - kmfa-dws-archive:/var/lib/kmfa/dws-archive
    healthcheck:
      test: ["CMD", "/opt/runtime/healthcheck.sh"]
      interval: 5m
      timeout: 20s
      start_period: 1m

  app:
    profiles: ["full"]                            # P2：容量确认后于 Coolify 启用 full profile 再起
    build:
      context: .
      dockerfile: KMFA/app/backend/Dockerfile
    image: kmfa-app:coolify
    container_name: kmfa-app
    restart: always
    environment:
      TZ: Asia/Shanghai
      # 根域名公开不等于私有 API 公开：生产源站二次校验 Access JWT。
      # 配置缺失时 /api*、/ops* fail-closed，/、/assets*、/healthz 仍可服务。
      KMFA_PUBLIC_SHELL_ENABLED: "${KMFA_PUBLIC_SHELL_ENABLED:-1}"
      # 搜索索引独立灰度；默认 hold，隐私/爬虫 canary 全绿后才显式置 1。
      KMFA_PUBLIC_INDEXING_ENABLED: "${KMFA_PUBLIC_INDEXING_ENABLED:-0}"
      # S03/P3.4 早期骨架独立灰度；默认关闭，启用前须确认 app state 卷与恢复/hash Oracle。
      KMFA_WALKING_SKELETON_ENABLED: "${KMFA_WALKING_SKELETON_ENABLED:-0}"
      # 快速回滚置 paused：只停新上传，不降 schema、不删 DB/对象/卷。
      KMFA_CONSISTENCY_STATE_MODE: "${KMFA_CONSISTENCY_STATE_MODE:-recoverable-v1}"
      # P5.4 默认暂停；active 还要求 S3 backend、当前 schema 隔离恢复与独立 worker 凭据。
      KMFA_LIFECYCLE_MODE: "${KMFA_LIFECYCLE_MODE:-paused}"
      # S05 expand/contract：Stage review 前默认保留 v1.5 SQLite read path。
      KMFA_STRUCTURED_DATABASE_MODE: "${KMFA_STRUCTURED_DATABASE_MODE:-legacy-sqlite}"
      KMFA_STRUCTURED_DATABASE_URL: "${KMFA_STRUCTURED_DATABASE_URL:-}"
      # P5.2 默认继续写旧卷；外部 R2/S3 仅在完整私有配置与 Oracle 通过后 opt-in。
      KMFA_ARTIFACT_STORAGE_MODE: "${KMFA_ARTIFACT_STORAGE_MODE:-legacy-filesystem}"
      KMFA_S3_ENDPOINT_URL: "${KMFA_S3_ENDPOINT_URL:-}"
      KMFA_S3_BUCKET: "${KMFA_S3_BUCKET:-}"
      KMFA_S3_REGION: "${KMFA_S3_REGION:-auto}"
      KMFA_S3_PREFIX: "${KMFA_S3_PREFIX:-kmfa/private/v1}"
      KMFA_S3_ACCESS_KEY_ID: "${KMFA_S3_ACCESS_KEY_ID:-}"
      KMFA_S3_SECRET_ACCESS_KEY: "${KMFA_S3_SECRET_ACCESS_KEY:-}"
      KMFA_S3_ADDRESSING_STYLE: "${KMFA_S3_ADDRESSING_STYLE:-path}"
      # Coolify/R2 必须保持 0；只有本机私网 MinIO fixture 才可显式置 1。
      KMFA_S3_ALLOW_INSECURE_LOCAL: "${KMFA_S3_ALLOW_INSECURE_LOCAL:-0}"
      # P4.4 匿名反滥用策略；未知值 fail-closed，紧急回滚只能切 expensive-only。
      KMFA_ABUSE_POLICY_MODE: "${KMFA_ABUSE_POLICY_MODE:-enforced}"
      KMFA_PRIVATE_OPS_REQUIRE_ACCESS: "${KMFA_PRIVATE_OPS_REQUIRE_ACCESS:-1}"
      KMFA_CLOUDFLARE_ACCESS_TEAM_DOMAIN: "${KMFA_CLOUDFLARE_ACCESS_TEAM_DOMAIN:-}"
      KMFA_CLOUDFLARE_ACCESS_AUD: "${KMFA_CLOUDFLARE_ACCESS_AUD:-}"
      DAILY_FUNDS_PUBLICATION_DIR: "/var/lib/kmfa/daily-funds"
      DAILY_FUNDS_CONTROL_DIR: "/var/lib/kmfa/daily-funds-control"
    # 代码/facts 已烧进镜像（自包含），不挂宿主仓
    volumes:
      # 只读挂 skills 的日志卷：App 要能显示「排程到底跑没跑」。
      # 在此之前 app 一个卷都不挂，排程健康只能靠人登服务器看——
      # 于是每次都要 Owner 亲自去查再回报，这个来回本身就是设计缺陷。
      - kmfa-logs:/var/log/kmfa:ro
      # SQLite 结构化状态与私有文件 adapter；普通重部署/Flag 回滚必须保留此卷。
      - kmfa-app-state:/var/lib/kmfa/state
      # 每日资金仅共享已验证 projection；app 不能读原始 DWS/Git/R2 数据。
      - kmfa-daily-funds-publication:/var/lib/kmfa/daily-funds:ro
      # 阈值请求由 Access 保护的 app 写入，独立 worker 复核、版本化并发布。
      - kmfa-daily-funds-control:/var/lib/kmfa/daily-funds-control
    expose:
      - "8000"                                    # 经 Coolify Traefik 暴露；域名在 Coolify 面板设，无需开放主机端口
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request;from pathlib import Path;from app.object_storage import configured_write_store;from app.structured_store import open_structured_store;p=Path('/var/lib/kmfa/state/walking-skeleton');s=open_structured_store(p/'walking_skeleton.sqlite3');assert s.schema_version()==4;s.close();o=configured_write_store(p);o.ensure_ready();urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 2m
      timeout: 10s

  structured-db:
    # P5.1 先交付可验证的共享数据库形态；只有显式同时启用 full,postgresql
    # 并通过迁移 Oracle 后才会启动，当前生产 rollout 不被中间 phase 自动切换。
    profiles: ["postgresql"]
    image: postgres:17.10-alpine3.23
    container_name: kmfa-structured-db
    restart: always
    environment:
      POSTGRES_DB: "${KMFA_POSTGRES_DB:-kmfa}"
      POSTGRES_USER: "${KMFA_POSTGRES_USER:-kmfa}"
      POSTGRES_PASSWORD: "${KMFA_POSTGRES_PASSWORD:-}"
    volumes:
      - kmfa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  lifecycle-worker:
    # 与 app 分离且无公网路由；legacy filesystem 不支持生产 active lifecycle。
    profiles: ["lifecycle"]
    build:
      context: .
      dockerfile: KMFA/app/backend/Dockerfile
    image: kmfa-app:coolify
    container_name: kmfa-lifecycle-worker
    restart: always
    command: ["python3", "-m", "app.lifecycle_worker", "--poll-seconds", "10"]
    environment:
      TZ: Asia/Shanghai
      KMFA_LIFECYCLE_MODE: "${KMFA_LIFECYCLE_MODE:-paused}"
      KMFA_STRUCTURED_DATABASE_MODE: "${KMFA_STRUCTURED_DATABASE_MODE:-legacy-sqlite}"
      KMFA_STRUCTURED_DATABASE_URL: "${KMFA_STRUCTURED_DATABASE_URL:-}"
      KMFA_S3_ENDPOINT_URL: "${KMFA_S3_ENDPOINT_URL:-}"
      KMFA_S3_BUCKET: "${KMFA_S3_BUCKET:-}"
      KMFA_S3_REGION: "${KMFA_S3_REGION:-auto}"
      KMFA_S3_PREFIX: "${KMFA_S3_PREFIX:-kmfa/private/v1}"
      KMFA_S3_LIFECYCLE_ACCESS_KEY_ID: "${KMFA_S3_LIFECYCLE_ACCESS_KEY_ID:-}"
      KMFA_S3_LIFECYCLE_SECRET_ACCESS_KEY: "${KMFA_S3_LIFECYCLE_SECRET_ACCESS_KEY:-}"
      KMFA_S3_ADDRESSING_STYLE: "${KMFA_S3_ADDRESSING_STYLE:-path}"
      KMFA_S3_ALLOW_INSECURE_LOCAL: "${KMFA_S3_ALLOW_INSECURE_LOCAL:-0}"
    volumes:
      - kmfa-app-state:/var/lib/kmfa/state

volumes:
  kmfa-daily-funds-state:
  kmfa-daily-funds-dws:
  kmfa-daily-funds-publication:
  kmfa-daily-funds-control:
  kmfa-dws-archive:
  kmfa-dws-auth:
  kmfa-dws-keyring:
  kmfa-logs:
  kmfa-app-state:
  # P5.4 本地候选已证明备份恢复；生产启用仍须 S05 Stage Review。ordinary rollback 禁止 down -v。
  kmfa-postgres-data:
