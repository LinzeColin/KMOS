interface:
  display_name: "项目成本表 Skill"
  short_description: "从私有全量输入生成 26 年度项目成本并返回报表与网站运行态输出路径"
  default_prompt: "请使用 $project-cost-table-skill 只读盘点本地、外接盘和私有 GitHub 数据，按项目过账实际加合格应计计算指定年度全部项目；状态表、主营成本和支付系统仅作独立观察面。先运行 self-test，再 calculate 和 verify-output；参考项目成本只做独立验收，禁止补差。最终给出封印 Excel、CSV、JSON、每项目 A4 PDF 与网站私有运行态的绝对路径。"
